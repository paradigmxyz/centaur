[package]
name = "centaur-company-context"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
absurd-sdk = { path = "../../crates/absurd-sdk" }
active-record-encryption = { path = "../../crates/active-record-encryption" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls", "stream"] }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio-rustls"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http = "1"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
