---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: sandboxwarmpools.extensions.agents.x-k8s.io
spec:
  group: extensions.agents.x-k8s.io
  names:
    kind: SandboxWarmPool
    listKind: SandboxWarmPoolList
    plural: sandboxwarmpools
    shortNames:
    - swp
    singular: sandboxwarmpool
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - jsonPath: .spec.replicas
      name: Desired
      type: integer
    - jsonPath: .spec.sandboxTemplateRef.name
      name: Template
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            properties:
              replicas:
                default: 1
                format: int32
                minimum: 0
                type: integer
              sandboxTemplateRef:
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              updateStrategy:
                properties:
                  type:
                    default: OnReplenish
                    enum:
                    - Recreate
                    - OnReplenish
                    type: string
                type: object
            required:
            - sandboxTemplateRef
            type: object
          status:
            properties:
              observedGeneration:
                format: int64
                minimum: 0
                type: integer
              readyReplicas:
                format: int32
                type: integer
              replicas:
                format: int32
                type: integer
              selector:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
  # Not upstream: an unserved v1alpha1 keeps this CRD valid against a cluster
  # whose status.storedVersions still lists v1alpha1, so a server-side dry run
  # (Argo CD's diff under ServerSideApply) succeeds and the chart's
  # agent-sandbox-crds hook can migrate it. Re-add after vendoring a new release.
  - name: v1alpha1
    served: false
    storage: false
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
