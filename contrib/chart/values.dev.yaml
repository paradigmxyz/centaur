secretManager:
  backend: onepassword
  envPrefix: ""
  existingSecretName: centaur-infra-env

firewall:
  existingCaSecretName: centaur-firewall-ca
  existingCaKeySecretName: centaur-firewall-ca-key

postgres:
  auth:
    existingSecretName: centaur-infra-env
    existingSecretKey: POSTGRES_PASSWORD

slackbot:
  enabled: true

api:
  executionWorkerEnabled: true
  egressDiscovery:
    enabled: false
  extraEnv:
    EXECUTION_WORKER_CONCURRENCY: "4"
    EXECUTION_RESERVED_USER_SLOTS: "2"

laminar:
  enabled: true

ironProxy:
  secretSource: env
