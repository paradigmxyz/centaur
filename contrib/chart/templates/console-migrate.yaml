{{- if .Values.apiRs.enabled }}
{{- $console := include "centaur.consoleValues" . | fromYaml }}
{{- $secretEnv := include "centaur.secretEnvName" . }}
{{- $prefix := .Values.secretManager.envPrefix }}
{{- $dbName := $console.database.name }}
{{- $migrateName := include "centaur.componentName" (dict "root" . "component" "console-migrate") }}
{{- /*
Console schema preparation. The Rails web pod used to run `db:prepare` on boot
(services/console/bin/docker-entrypoint) and owned the create-db init container;
with no web pod, this Job takes both over:

  1. create-db creates the primary database and the Solid Cache/Queue/Cable
     databases on the bundled Postgres, idempotently.
  2. `bin/rails db:prepare` loads the schema on a fresh database and applies
     pending migrations on an existing one.
  3. `bin/rails runner 'Iron::Bootstrap.run!'` runs the Rails bootstrap
     (config/initializers/bootstrap.rb): the initial admin user, the default
     infra role, and the API key. The initializer skips while migrations are
     pending — the state during `db:prepare`'s own boot on a fresh database — so
     the Job runs it explicitly after `db:prepare`. Doing it here rather than
     only in the worker keeps the bootstrap independent of the worker's replica
     count. It is idempotent: it returns once any user exists.

Hook phase: Helm runs pre-install/pre-upgrade hooks before it creates or updates
the release's other resources, so api-rs, proxy-sync, token-broker, and the
Console worker start only after the schema exists. A bundled Postgres does not
exist until Helm applies the release, so a pre-install Job could never reach it;
there the Job is an ordinary install-time resource instead, and the consumers'
wait-for-console-schema init containers wait for the schema. Upgrades always use
the pre-upgrade hook, because the database exists by then.

The Job's own NetworkPolicy is rendered with it: during a pre-upgrade hook the
previous release's default-deny policy is already in force, so the hook pod
needs an egress rule before it can reach Postgres.
*/ -}}
{{- $hook := "" }}
{{- if .Release.IsInstall }}
{{- if not .Values.postgres.enabled }}{{ $hook = "pre-install" }}{{ end }}
{{- else }}
{{- $hook = "pre-upgrade" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $migrateName }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "console-migrate") | nindent 4 }}
{{- if $hook }}
  annotations:
    "helm.sh/hook": {{ $hook | quote }}
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- end }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  # Keep a completed or failed Job long enough to read its logs, then clean up.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      annotations:
        checksum/infra-secrets: {{ include "centaur.infraSecretsChecksum" . }}
      labels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "console-migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
{{- /* Same placement as api-rs: the Job reaches the same Console database and
   secrets, so it belongs on the control-plane node pool when one is pinned. */ -}}
{{- include "centaur.podScheduling" (dict "values" .Values.apiRs "indent" 6) }}
      initContainers:
        # Create the console logical databases on the bundled Postgres: the
        # primary plus the Solid Cache/Queue/Cable databases (see
        # config/database.yml). `db:prepare` loads schema and migrates each one
        # but does not create them, so they are provisioned here as the admin
        # (ai_v2) DSN whose `tempo` superuser can create databases. Idempotent:
        # each CREATE is guarded by a pg_database check and tolerates a lost race
        # against a concurrent run.
        - name: create-db
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              # Wait until Postgres accepts connections. A still-starting Postgres
              # — or a Service with no ready endpoint yet, which is also the case
              # on a bundled-Postgres install — surfaces as connection refused;
              # retry rather than failing (and crash-looping) the Job.
              until psql "$ADMIN_DATABASE_URL" -tAc 'SELECT 1' >/dev/null 2>&1; do
                echo "waiting for postgres to accept connections..."
                sleep 2
              done
              # Create each database idempotently.
              for db in $DB_NAMES; do
                exists=$(psql "$ADMIN_DATABASE_URL" -tAc \
                  "SELECT 1 FROM pg_database WHERE datname = '$db'")
                if [ "$exists" != "1" ]; then
                  echo "creating database $db"
                  psql "$ADMIN_DATABASE_URL" -c "CREATE DATABASE \"$db\"" || true
                fi
              done
          env:
            - name: ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sDATABASE_URL" $prefix }}
            # Primary + Solid Cache/Queue/Cable, matching config/database.yml.
            - name: DB_NAMES
              value: {{ printf "%s %s_cache %s_queue %s_cable" $dbName $dbName $dbName $dbName | quote }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: console-migrate
          image: {{ printf "%s:%s" $console.image.repository $console.image.tag | quote }}
          imagePullPolicy: {{ $console.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              bin/rails db:prepare
              bin/rails runner 'Iron::Bootstrap.run!'
          env:
            # Explicit secretKeyRefs only — never envFrom the shared Secret, or
            # its DATABASE_URL (ai_v2) would leak into the Rails process. Console
            # reads IRON_CONTROL_DATABASE_URL through ConsoleEnv's legacy
            # fallback for its DATABASE_URL.
            - name: IRON_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_DATABASE_URL" $prefix }}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_SECRET_KEY_BASE" $prefix }}
            # encryption.rb refuses to boot production without the three
            # ActiveRecord encryption keys.
            - name: IRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_DETERMINISTIC_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT" $prefix }}
            # The bootstrap creates the initial admin and its API key.
            - name: IRON_CONTROL_INITIAL_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_INITIAL_USER_EMAIL" $prefix }}
            - name: IRON_CONTROL_INITIAL_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_INITIAL_USER_PASSWORD" $prefix }}
            - name: IRON_CONTROL_INITIAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_INITIAL_API_KEY" $prefix }}
            - name: RAILS_ENV
              value: {{ $console.railsEnv | quote }}
            - name: RAILS_LOG_TO_STDOUT
              value: "1"
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
            # No readOnlyRootFilesystem — Rails writes to tmp/ at runtime.
            seccompProfile:
              type: RuntimeDefault
          resources:
{{ toYaml $console.resources | nindent 12 }}
{{- if .Values.networkPolicy.enabled }}
---
# Egress for the migration pod. It is rendered with the Job (and, like the Job,
# becomes a hook resource when the Job is one) because a pre-upgrade hook runs
# before Helm applies the new release's policies, while the previous release's
# default-deny already selects this pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $migrateName }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "console-migrate") | nindent 4 }}
{{- if $hook }}
  annotations:
    "helm.sh/hook": {{ $hook | quote }}
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
{{- end }}
spec:
  podSelector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "console-migrate") | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{- include "centaur.postgresEgress" . | nindent 4 }}
{{- end }}
{{- end }}
