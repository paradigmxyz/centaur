{{- $name := include "centaur.proxySyncName" . }}
{{- $secretEnv := include "centaur.secretEnvName" . }}
{{- $prefix := .Values.secretManager.envPrefix }}
{{- $console := include "centaur.consoleValues" . | fromYaml }}
{{- $companyContext := include "centaur.companyContextValues" . | fromYaml }}
{{- $apiRsName := include "centaur.componentName" (dict "root" . "component" "api-rs") }}
{{- $metricsAnnotations := dict -}}
{{- if .Values.proxySync.metrics.scrapeAnnotations -}}
{{- $metricsAnnotations = dict "prometheus.io/scrape" "true" "prometheus.io/path" .Values.proxySync.metrics.path "prometheus.io/port" (printf "%v" .Values.proxySync.port) -}}
{{- $metricsAnnotations = mergeOverwrite $metricsAnnotations (.Values.proxySync.metrics.annotations | default dict) -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "proxy-sync") | nindent 4 }}
spec:
  selector:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "proxy-sync") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.proxySync.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "proxy-sync") | nindent 4 }}
spec:
  replicas: {{ .Values.proxySync.replicaCount }}
  selector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "proxy-sync") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/infra-secrets: {{ include "centaur.infraSecretsChecksum" . }}
{{- with $metricsAnnotations }}
{{ toYaml . | nindent 8 }}
{{- end }}
      labels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "proxy-sync") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
{{- include "centaur.podScheduling" (dict "values" .Values.proxySync "indent" 6) }}
      initContainers:
        # proxy-sync reads principals, proxies, and their grants from the Console
        # database, so wait for the schema api-rs applies.
{{ include "centaur.consoleDbWait" (dict
  "root" .
  "name" "wait-for-console-schema"
  "database" $console.database.name
  "query" "SELECT to_regclass('public.users') IS NOT NULL"
  "message" "waiting for the Console schema (api-rs)…") | nindent 8 }}
      containers:
        - name: proxy-sync
          image: {{ printf "%s:%s" .Values.proxySync.image.repository .Values.proxySync.image.tag | quote }}
          imagePullPolicy: {{ .Values.proxySync.image.pullPolicy }}
          env:
            - name: BIND_ADDR
              value: {{ printf "0.0.0.0:%v" .Values.proxySync.port | quote }}
            - name: DATABASE_MAX_CONNECTIONS
              value: {{ .Values.proxySync.databaseMaxConnections | quote }}
            - name: IRON_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_DATABASE_URL" $prefix }}
            - name: IRON_CONTROL_DATABASE_NAME
              value: {{ $console.database.name | quote }}
            - name: IRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT" $prefix }}
            - name: CENTAUR_JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sCENTAUR_JWT_SIGNING_SECRET" $prefix }}
            - name: CENTAUR_CONSOLE_URL
              value: {{ include "centaur.consoleUrl" . | quote }}
            # Proxies inject the sandbox token into requests to these hosts in
            # addition to CENTAUR_API_URL's and CENTAUR_CONSOLE_URL's. The
            # compatibility Console Service also routes to api-rs, and connectors
            # and tools default to it when CENTAUR_CONSOLE_URL is unset, so it
            # needs the token too.
{{- $proxyHosts := list (include "centaur.consoleName" .) }}
{{- if $companyContext.enabled }}
{{- $proxyHosts = append $proxyHosts (include "centaur.componentName" (dict "root" . "component" "company-context")) }}
{{- end }}
            - name: CENTAUR_API_SERVER_PROXY_HOSTS
              value: {{ join "," $proxyHosts | quote }}
{{- if .Values.apiRs.enabled }}
            - name: CENTAUR_API_URL
              value: {{ printf "http://%s:%v" $apiRsName .Values.apiRs.port | quote }}
{{- end }}
            - name: RUST_LOG
              value: info
            - name: CENTAUR_SSH_TARGETS
              value: {{ .Values.proxySync.sshTargets | toJson | quote }}
{{- if .Values.codemode.executor.enabled }}
            # Code Mode principal config for the tenancy iron-proxy: the sync
            # token authenticates the proxy, the public key verifies the turn
            # token it forwards.
{{ include "centaur.codemodeSecretEnv" (dict "root" . "name" "CENTAUR_CODEMODE_SYNC_TOKEN" "key" "sync-token") | indent 12 }}
{{ include "centaur.codemodeSecretEnv" (dict "root" . "name" "CENTAUR_CODEMODE_TOKEN_PUBLIC_KEY" "key" "token-public-key") | indent 12 }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.proxySync.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
{{ toYaml .Values.proxySync.resources | nindent 12 }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "proxy-sync") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "proxy-sync") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              centaur.ai/iron-proxy: "true"
{{- if .Values.codemode.executor.enabled }}
        # The Code Mode tenancy iron-proxy fetches turn principal configuration.
        - podSelector:
            matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "codemode-iron-proxy") | nindent 14 }}
{{- end }}
{{- range .Values.networkPolicy.apiIngressSourceNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.proxySync.port }}
  egress:
    {{- include "centaur.postgresEgress" . | nindent 4 }}
{{- end }}
