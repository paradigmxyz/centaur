{{- $console := include "centaur.consoleValues" . | fromYaml }}
{{- $secretEnv := include "centaur.secretEnvName" . }}
{{- $prefix := .Values.secretManager.envPrefix }}
{{- $apiRsName := include "centaur.componentName" (dict "root" . "component" "api-rs") }}
{{- $mcpPublicUrl := default .Values.slackbotv2.mcpPublicUrl .Values.apiRs.mcpPublicUrl }}
{{- if lt (int $console.worker.replicaCount) 1 }}
{{- fail "console.worker.replicaCount must be at least 1: the worker runs the Slack channel catalog jobs" }}
{{- end }}
# console background job worker — runs Solid Queue (`bin/jobs`) for the Console
# jobs that still live in Rails: the Slack channel catalog refresh and membership
# refresh. The Console itself is served by api-rs, so this worker is the only
# Rails process left. api-rs owns the Console schema; the worker only prepares
# its Solid Cache/Queue/Cable databases (see its init containers).
# Broker-credential OAuth refresh, which the Console used to own, runs in
# api-rs's token-broker.
#
# It shares the Console image and the same infra-Secret env (DB URL, ActiveRecord
# encryption keys, SECRET_KEY_BASE) so it can decrypt stored credentials. It
# uses its own `console-worker` component label so the compatibility `console`
# Service (which selects api-rs) never routes traffic to it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "centaur.componentName" (dict "root" . "component" "console-worker") }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "console-worker") | nindent 4 }}
spec:
  replicas: {{ $console.worker.replicaCount }}
  selector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "console-worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/infra-secrets: {{ include "centaur.infraSecretsChecksum" . }}
      labels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "console-worker") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
{{- include "centaur.podScheduling" (dict "values" $console.worker "indent" 6) }}
      initContainers:
        # api-rs owns the Console schema and the initial-admin bootstrap, and
        # creates this worker's Solid Cache/Queue/Cable databases; wait for it.
{{ include "centaur.consoleDbWait" (dict
  "root" .
  "name" "wait-for-console-schema"
  "database" $console.database.name
  "query" "SELECT to_regclass('public.users') IS NOT NULL"
  "message" "waiting for the Console schema (api-rs)…") | nindent 8 }}
        - name: prepare-job-dbs
          image: {{ printf "%s:%s" $console.image.repository $console.image.tag | quote }}
          imagePullPolicy: {{ $console.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              # Prepares only the Solid Cache/Queue/Cable databases: the primary
              # sets `database_tasks: false` because api-rs migrates it. Rails
              # takes an advisory lock, so concurrent replicas are safe.
              bin/rails db:prepare
          env:
            # Explicit secretKeyRefs only — never envFrom the shared Secret, or
            # its DATABASE_URL (ai_v2) would leak into the Rails process. Console
            # reads IRON_CONTROL_DATABASE_URL through ConsoleEnv's legacy
            # fallback for its DATABASE_URL.
            - name: IRON_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_DATABASE_URL" $prefix }}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_SECRET_KEY_BASE" $prefix }}
            # encryption.rb refuses to boot production without the three
            # ActiveRecord encryption keys.
            - name: IRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_DETERMINISTIC_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT" $prefix }}
            - name: RAILS_ENV
              value: {{ $console.railsEnv | quote }}
            - name: RAILS_LOG_TO_STDOUT
              value: "1"
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
            # No readOnlyRootFilesystem — Rails writes to tmp/ at runtime.
            seccompProfile:
              type: RuntimeDefault
          resources:
{{ toYaml $console.resources | nindent 12 }}
      containers:
        - name: console-worker
          image: {{ printf "%s:%s" $console.image.repository $console.image.tag | quote }}
          imagePullPolicy: {{ $console.image.pullPolicy }}
          # Solid Queue supervisor. Claims and runs jobs from the
          # <primary>_queue database; serves no HTTP.
          command:
            - bin/jobs
          env:
            # Same secretKeyRefs as the web container so the worker can reach
            # Postgres and decrypt stored credentials. No PORT / static-file
            # serving — this process serves no HTTP.
            - name: IRON_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_DATABASE_URL" $prefix }}
            - name: CENTAUR_CONSOLE_CENTAUR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sDATABASE_URL" $prefix }}
            # The Slack channel catalog refresh and membership jobs run in this
            # worker, so it needs the same bot token as the web Console process.
            - name: CENTAUR_CONSOLE_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sSLACK_BOT_TOKEN" $prefix }}
                  optional: true
            - name: IRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_DETERMINISTIC_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT" $prefix }}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_SECRET_KEY_BASE" $prefix }}
            - name: CENTAUR_JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sCENTAUR_JWT_SIGNING_SECRET" $prefix }}
{{- if $console.publicUrl }}
            - name: CENTAUR_CONSOLE_PUBLIC_URL
              value: {{ $console.publicUrl | quote }}
{{- end }}
{{- with $console.sentryDsn }}
            - name: SENTRY_DSN
              value: {{ . | quote }}
{{- end }}
{{- if $mcpPublicUrl }}
            - name: CENTAUR_MCP_PUBLIC_URL
              value: {{ $mcpPublicUrl | quote }}
{{- end }}
{{- if $console.googleOauth.enabled }}
            # Google OAuth app credentials, needed by the broker-credential
            # OAuth refresh loop. Gated on console.googleOauth.enabled.
            - name: IRON_CONTROL_GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_GOOGLE_CLIENT_ID" $prefix }}
            - name: IRON_CONTROL_GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_GOOGLE_CLIENT_SECRET" $prefix }}
{{- end }}
            - name: RAILS_ENV
              value: {{ $console.railsEnv | quote }}
            - name: RAILS_LOG_TO_STDOUT
              value: "1"
{{- if .Values.apiRs.enabled }}
            - name: CENTAUR_API_URL
              value: {{ printf "http://%s:%v" $apiRsName .Values.apiRs.port | quote }}
            # Console OAuth sync workers submit normalized provider data to the
            # in-cluster API; credentials themselves never leave this pod.
            - name: CENTAUR_CONSOLE_CENTAUR_API_URL
              value: {{ printf "http://%s:%v" $apiRsName .Values.apiRs.port | quote }}
{{- end }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
            # No readOnlyRootFilesystem — Rails writes to tmp/ at runtime.
            seccompProfile:
              type: RuntimeDefault
          resources:
{{ toYaml $console.worker.resources | nindent 12 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "centaur.componentName" (dict "root" . "component" "console-worker") }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "console-worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "console-worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules: the worker serves no traffic, so all inbound is denied.
  egress:
    {{- include "centaur.postgresEgress" . | nindent 4 }}
{{- if .Values.apiRs.enabled }}
    - to:
        - podSelector:
            matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "api-rs") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.apiRs.port }}
{{- end }}
    # Outbound HTTPS to OAuth token endpoints for the broker refresh loop.
    - ports:
        - protocol: TCP
          port: 443
    # DNS egress is provided by the namespace-wide allow-dns policy.
{{- end }}
