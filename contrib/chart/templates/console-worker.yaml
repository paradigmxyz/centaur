{{- $console := include "centaur.consoleValues" . | fromYaml }}
{{- $secretEnv := include "centaur.secretEnvName" . }}
{{- $prefix := .Values.secretManager.envPrefix }}
{{- $apiRsName := include "centaur.componentName" (dict "root" . "component" "api-rs") }}
{{- $mcpPublicUrl := default .Values.slackbotv2.mcpPublicUrl .Values.apiRs.mcpPublicUrl }}
# console background worker — `centaur-console worker` from the api-rs image
# (RFC 0006, Decision 3): the Slack channel catalog and membership refresh
# loops, each under a Postgres advisory lock, so replicas never work a loop
# twice. There is no job queue; broker-credential refresh belongs to
# token-broker and scheduled tasks to api-rs. The web Deployment owns database
# setup (create-db init + `centaur-console serve`'s migrate on boot), so this
# worker waits for the console database to exist before starting.
#
# It uses the same infra-Secret env (DB URL, ActiveRecord encryption keys,
# SECRET_KEY_BASE) as the web pods so it can decrypt stored credentials. It
# uses its own `console-worker` component label so it is NOT selected by the
# console Service (which load-balances HTTP to the web pods).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "centaur.componentName" (dict "root" . "component" "console-worker") }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "console-worker") | nindent 4 }}
spec:
  replicas: {{ $console.worker.replicaCount }}
  selector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "console-worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/infra-secrets: {{ include "centaur.infraSecretsChecksum" . }}
      labels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "console-worker") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
{{- include "centaur.podScheduling" (dict "values" $console.worker "indent" 6) }}
      initContainers:
        # Wait for the console database (created by the web pod's create-db
        # init container) so a cold start does not crash-loop before it
        # exists. Read-only and idempotent; connects as the admin (ai_v2) DSN.
        - name: wait-for-db
          image: {{ printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              until [ "$(psql "$ADMIN_DATABASE_URL" -tAc \
                "SELECT 1 FROM pg_database WHERE datname = '$CONSOLE_DB_NAME'")" = "1" ]; do
                echo "waiting for database $CONSOLE_DB_NAME to exist…"
                sleep 2
              done
          env:
            - name: ADMIN_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sDATABASE_URL" $prefix }}
            - name: CONSOLE_DB_NAME
              value: {{ $console.database.name | quote }}
          securityContext:
{{ toYaml .Values.containerSecurityContext | nindent 12 }}
            seccompProfile:
              type: RuntimeDefault
      containers:
        - name: console-worker
{{ include "centaur.consoleImage" . | indent 10 }}
          # The advisory-locked background loops; serves no HTTP.
          command:
            - /usr/local/bin/centaur-console
            - worker
          env:
            # Same secretKeyRefs as the web container so the worker can reach
            # Postgres and decrypt stored credentials. No PORT — this process
            # serves no HTTP.
            - name: IRON_CONTROL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_DATABASE_URL" $prefix }}
            - name: CENTAUR_CONSOLE_CENTAUR_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sDATABASE_URL" $prefix }}
            # The Slack channel catalog loops run in this worker, so it needs
            # the same bot token as the web Console process.
            - name: CENTAUR_CONSOLE_SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sSLACK_BOT_TOKEN" $prefix }}
                  optional: true
            - name: IRON_CONTROL_INITIAL_USER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_INITIAL_USER_EMAIL" $prefix }}
            - name: IRON_CONTROL_INITIAL_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_INITIAL_USER_PASSWORD" $prefix }}
            - name: IRON_CONTROL_INITIAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_INITIAL_API_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_PRIMARY_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_DETERMINISTIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_DETERMINISTIC_KEY" $prefix }}
            - name: IRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_AR_ENCRYPTION_KEY_DERIVATION_SALT" $prefix }}
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sIRON_CONTROL_SECRET_KEY_BASE" $prefix }}
            - name: CENTAUR_JWT_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretEnv }}
                  key: {{ printf "%sCENTAUR_JWT_SIGNING_SECRET" $prefix }}
{{- if $console.publicUrl }}
            - name: CENTAUR_CONSOLE_PUBLIC_URL
              value: {{ $console.publicUrl | quote }}
{{- end }}
{{- if $mcpPublicUrl }}
            - name: CENTAUR_MCP_PUBLIC_URL
              value: {{ $mcpPublicUrl | quote }}
{{- end }}
            - name: RUST_LOG
              value: info
{{- if .Values.apiRs.enabled }}
            - name: CENTAUR_API_URL
              value: {{ printf "http://%s:%v" $apiRsName .Values.apiRs.port | quote }}
            - name: CENTAUR_CONSOLE_CENTAUR_API_URL
              value: {{ printf "http://%s:%v" $apiRsName .Values.apiRs.port | quote }}
{{- end }}
{{- range $name, $value := $console.extraEnv }}
            - name: {{ $name }}
              value: {{ $value | quote }}
{{- end }}
          securityContext:
{{ include "centaur.consoleSecurityContext" . | indent 12 }}
          resources:
{{ toYaml $console.worker.resources | nindent 12 }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "centaur.componentName" (dict "root" . "component" "console-worker") }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "console-worker") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "console-worker") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # No ingress rules: the worker serves no traffic, so all inbound is denied.
  egress:
    {{- include "centaur.postgresEgress" . | nindent 4 }}
{{- if .Values.apiRs.enabled }}
    - to:
        - podSelector:
            matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "api-rs") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.apiRs.port }}
{{- end }}
    # Outbound HTTPS (the Slack API for the channel catalog loops).
    - ports:
        - protocol: TCP
          port: 443
    # DNS egress is provided by the namespace-wide allow-dns policy.
{{- end }}
