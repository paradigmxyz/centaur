{{- if .Values.apiRs.enabled }}
{{- $console := include "centaur.consoleValues" . | fromYaml }}
# console — compatibility Service for the Console, which api-rs serves. The
# Console host, its JSON API, the SPA, the MCP
# OAuth endpoints, and the bearer/sandbox APIs all answer from the api-rs
# listener (see templates/apirs.yaml and
# crates/centaur-api-server/src/console/README.md).
#
# This Service keeps the historical name (`<release>-centaur-console`) and port
# (console.service.httpPort, 3000) but selects api-rs, so any in-cluster client
# with a cached `centaur-console:3000` URL still reaches the Console. The Code
# Mode connectors in connectors/ fall back to exactly that URL when the sandbox
# does not set CENTAUR_CONSOLE_URL. New wiring should use centaur.consoleUrl.
#
# api-rs also owns the Console database schema (crates/centaur-console-db/
# migrations) and refreshes the Slack channel catalog.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "centaur.consoleName" . }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "console") | nindent 4 }}
spec:
  selector:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "api-rs") | nindent 4 }}
  ports:
    - name: http
      port: {{ $console.service.httpPort }}
      targetPort: {{ .Values.apiRs.port }}
{{- end }}
