{{- $console := include "centaur.consoleValues" . | fromYaml }}
{{- $backendName := include "centaur.consoleName" . }}
{{- $backendPort := $console.service.httpPort }}
{{- if eq (include "centaur.consoleBackend" .) "apirs" }}
{{- $backendName = include "centaur.componentName" (dict "root" . "component" "api-rs") }}
{{- $backendPort = .Values.apiRs.port }}
{{- end }}
{{- if $console.ingress.enabled }}
# Optional Ingress for the console; the controller (Tailscale operator,
# Cloudflare, ingress-nginx, ...) is installed separately and selected via
# console.ingress.className. defaultBackend renders the single-backend
# form some controllers (the Tailscale operator) require instead of host/path
# rules. With console.backend=apirs it targets the api-rs Service/port that
# serves the ported Console; the Ingress name and labels stay stable.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "centaur.consoleName" . }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "console") | nindent 4 }}
  {{- with $console.ingress.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $console.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $console.ingress.defaultBackend }}
  defaultBackend:
    service:
      name: {{ $backendName }}
      port:
        number: {{ $backendPort }}
  {{- else }}
  rules:
    - {{- if $console.ingress.host }}
      host: {{ $console.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  number: {{ $backendPort }}
  {{- end }}
  {{- with $console.ingress.tls }}
  tls:
{{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
