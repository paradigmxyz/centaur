{{- $console := include "centaur.consoleValues" . | fromYaml }}
{{- if and .Values.apiRs.enabled $console.ingress.enabled }}
{{- $backendName := include "centaur.componentName" (dict "root" . "component" "api-rs") }}
{{- $backendPort := .Values.apiRs.port }}
# Optional Ingress for the Console public host; the controller (Tailscale
# operator, Cloudflare, ingress-nginx, ...) is installed separately and selected
# via console.ingress.className. api-rs serves the Console on its own port, so
# the Ingress targets the api-rs Service; the name and labels stay stable so
# existing controller configuration keeps working. defaultBackend renders the
# single-backend form some controllers (the Tailscale operator) require instead
# of host/path rules.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "centaur.consoleName" . }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" "console") | nindent 4 }}
  {{- with $console.ingress.annotations }}
  annotations:
{{ toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $console.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $console.ingress.defaultBackend }}
  defaultBackend:
    service:
      name: {{ $backendName }}
      port:
        number: {{ $backendPort }}
  {{- else }}
  rules:
    - {{- if $console.ingress.host }}
      host: {{ $console.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  number: {{ $backendPort }}
  {{- end }}
  {{- with $console.ingress.tls }}
  tls:
{{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
