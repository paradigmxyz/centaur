{{- /*
Workflow discovery: imports workflow modules for api-rs so their code never runs
there. api-rs sends the workflow env with each request. No secrets, read-only
sources, and (under networkPolicy) reachable only from api-rs with no egress.
*/ -}}
{{- if .Values.apiRs.enabled }}
{{- $component := "workflow-discovery" -}}
{{- $name := include "centaur.componentName" (dict "root" . "component" $component) -}}
{{- $discovery := .Values.workflowDiscovery -}}
{{- $reposPath := include "centaur.reposPath" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
{{- include "centaur.podScheduling" (dict "values" $discovery "indent" 6) }}
      containers:
        - name: workflow-discovery
          image: {{ printf "%s:%s" .Values.sandbox.image.repository .Values.sandbox.image.tag | quote }}
          imagePullPolicy: {{ .Values.sandbox.image.pullPolicy }}
          command: ["python3", "/usr/local/bin/workflow-host", "serve"]
          env:
            - name: WORKFLOW_DISCOVERY_PORT
              value: {{ $discovery.port | quote }}
            - name: PYTHONPATH
              value: /opt/centaur
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: {{ $discovery.port }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
{{ toYaml $discovery.resources | nindent 12 }}
          securityContext:
{{ toYaml (merge (dict "readOnlyRootFilesystem" true) .Values.containerSecurityContext) | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
{{- if $reposPath }}
            - name: repos
              mountPath: /home/agent/github
              readOnly: true
{{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
{{- if $reposPath }}
        - name: repos
{{- /* Same choice api-rs makes for sandboxes (REPOS_PVC), so both see the same files. */}}
{{- if eq (include "centaur.repoCacheStorageType" .) "persistentVolumeClaim" }}
          persistentVolumeClaim:
            claimName: {{ include "centaur.repoCachePvcName" . | quote }}
            readOnly: true
{{- else }}
          hostPath:
            path: {{ $reposPath | quote }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  selector:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ $discovery.port }}
      targetPort: http
{{- if .Values.networkPolicy.enabled }}
---
# The service is unauthenticated; this policy is its trust boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
{{ include "centaur.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
{{ include "centaur.componentSelectorLabels" (dict "root" . "component" "api-rs") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $discovery.port }}
  egress: []
{{- end }}
{{- end }}
