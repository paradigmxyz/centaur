# kind cluster for the e2e stack. The test runner reaches the fakes, Postgres,
# api-rs, and the console through these NodePorts instead of kubectl port-forward/exec, which
# drop connections and add load when many scenarios run at once.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    # Every thread keeps a sandbox and an iron-proxy pod until it idles out
    # (hours), so a full run holds about two pods per scenario. The kubelet's
    # default cap of 110 pods leaves the suite no headroom.
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        maxPods: 250
    extraPortMappings:
      - containerPort: 30443 # fake Slack API (fake-slack.yaml)
        hostPort: 30443
        listenAddress: 127.0.0.1
      - containerPort: 30080 # model server control API (model-server.yaml)
        hostPort: 30080
        listenAddress: 127.0.0.1
      - containerPort: 30432 # release Postgres (test-access.yaml)
        hostPort: 30432
        listenAddress: 127.0.0.1
      - containerPort: 30081 # release api-rs (test-access.yaml)
        hostPort: 30081
        listenAddress: 127.0.0.1
      - containerPort: 30082 # release Console host and operator API, served by api-rs (test-access.yaml)
        hostPort: 30082
        listenAddress: 127.0.0.1
