# Overrides layered on values.dev.yaml for the e2e stack: the real control
# plane, proxy, sandboxes, and slackbotv2, minus optional services and anything
# that needs real credentials.

# Model keys are fixed test keys in centaur-infra-env instead of 1Password.
ironProxy:
  secretSource: env

# With the env source, iron-proxy pods (and only they) also load this Secret.
# e2e/stack.sh puts SSL_CERT_FILE in it so they trust the model server's cert.
secrets:
  bootstrapSecretName: centaur-e2e-iron-proxy-env

# Sandboxes run the tools baked into the image; nothing is cloned from GitHub.
toolServer:
  enabled: false
# Install only the baked-in tool CLIs a scenario runs: remote-ssh, for
# e2e/tests/ssh.test.ts, and demo, for e2e/tests/tools.test.ts, which also
# expects every other baked-in tool to stay unmounted.
sandbox:
  extraEnv:
    TOOLS_PATH: /opt/centaur/tools
    TOOL_ALLOWLIST: ssh,demo
repoCache:
  enabled: false

# e2e/tests/api-clients.test.ts drives the session API as an API client.
apiClients:
  enabled: true

# Both Slack clients talk to the fake Slack.
apiRs:
  extraEnv:
    SLACK_API_URL: http://fake-slack.centaur-e2e-slack.svc.cluster.local:443/api
    # Workflows the tests write or remove take effect within a second or two.
    WORKFLOW_RECONCILE_INTERVAL_SECS: "1"
    WORKFLOW_REAP_REMOVED_AFTER_TICKS: "1"
    # Paired iron-proxies get an SSH listener; e2e/stack.sh puts
    # CENTAUR_SSH_SEED in centaur-infra-env. e2e/tests/ssh.test.ts uses it.
    KUBERNETES_IRON_PROXY_SSH_ENABLED: "true"
  sandboxWarmPoolSize: 0
  workflowHostSandbox: false
  # The fixture persona e2e/tests/selection.test.ts selects. e2e/stack.sh
  # creates this ConfigMap from e2e/fixtures/personas/e2e; it is mounted for
  # api-rs only, so no deployed image ships the persona.
  extraToolDirs: [/app/e2e-tools]
  extraVolumes:
    - name: e2e-personas
      configMap:
        name: centaur-e2e-personas
        items:
          - { key: PROMPT.md, path: personas/e2e/PROMPT.md }
          - { key: pyproject.toml, path: personas/e2e/pyproject.toml }
  extraVolumeMounts:
    - { name: e2e-personas, mountPath: /app/e2e-tools, readOnly: true }

proxySync:
  replicaCount: 1
  # The SSH gateway e2e/stack.sh deploys (e2e/infra/ssh-gateway.yaml).
  sshTargets:
    - host: "*.ssh-gateway.test"
      path: /events/events
      username: dev

# The test runner calls the console API through its NodePort (test-access.yaml).
console:
  allowedHosts: [127.0.0.1]

slackbotv2:
  extraEnv:
    SLACK_API_URL: http://fake-slack.centaur-e2e-slack.svc.cluster.local:443/api/
  # DEFAULTS_CHANNEL in e2e/fakes/slack-fixture.ts; e2e/tests/selection.test.ts
  # expects these defaults.
  channelDefaults:
    CE2E00002: { persona: e2e, harness: claude, model: sonnet, reasoning: high }
  steeringReactionEnabled: true

networkPolicy:
  ingressSourceNamespaces:
    - centaur-e2e-slack


codex:
  customProviders:
    fixture:
      name: Fixture Provider
      baseUrl: https://custom-provider.test/v1
      apiKeyEnv: E2E_CUSTOM_API_KEY
      defaultModel: fixture-reasoner
      models:
        fixture-reasoner:
          displayName: Fixture Reasoner
          contextWindow: 65536
          inputModalities: [text]
          aliases: [fixture]
          reasoningEfforts: [low, high, max]
          defaultReasoning: high
          reasoningAliases:
            medium: high
            xhigh: max
        fixture-fast:
          displayName: Fixture Fast
          contextWindow: 32768
          inputModalities: [text]
          aliases: [fixture-fast]
          reasoningEfforts: [low, high]
          defaultReasoning: low
