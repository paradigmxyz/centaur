# Lets the test runner read the release's durable session tables directly.
# The chart's Postgres NetworkPolicy only admits release components, so this
# additive policy admits NodePort traffic, which reaches the pod from the node.
apiVersion: v1
kind: Service
metadata:
  name: e2e-postgres
  namespace: centaur
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: centaur
    app.kubernetes.io/instance: centaur
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: e2e-postgres-from-node
  namespace: centaur
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: centaur
      app.kubernetes.io/component: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 5432
