# kind cluster for the e2e stack. The test runner reaches the fakes and
# Postgres through these NodePorts instead of kubectl port-forward/exec, which
# drop connections and add load when many scenarios run at once.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30443 # fake Slack API (fake-slack.yaml)
        hostPort: 30443
        listenAddress: 127.0.0.1
      - containerPort: 30080 # model server control API (model-server.yaml)
        hostPort: 30080
        listenAddress: 127.0.0.1
      - containerPort: 30432 # release Postgres (postgres-access.yaml)
        hostPort: 30432
        listenAddress: 127.0.0.1
