model = "gpt-5.5"
model_reasoning_effort = "low"
personality = "pragmatic"
model_verbosity = "low"
service_tier = "fast"
approval_policy = "never"
sandbox_mode = "danger-full-access"
suppress_unstable_features_warning = true

[features]
goals = true
fast_mode = true
memories = true
hooks = true
enable_fanout = false
runtime_metrics = true

# Disabled on codex >= 0.139: multi_agent_v2 marks spawn_agent/send_message/
# followup_task params "encrypted", and api-key models reject the schema with
# 400 "declares encrypted parameters but is not configured for encrypted tool
# use" before the model sees the prompt (openai/codex#26753, #27205). The
# legacy/stable subagent flow still covers spawn/wait. Re-enable once the
# model/account supports encrypted tool use.
[features.multi_agent_v2]
enabled = false
max_concurrent_threads_per_session = 6

[agents]
max_depth = 2
job_max_runtime_seconds = 1800

[tools]
view_image = true

[projects."/"]
trust_level = "trusted"
