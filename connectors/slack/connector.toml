description = "Slack: search messages, read channels, members, threads and users, post and react"

# No declared secrets. Credentials come from platform grants, as for the Python
# slack tool: a principal with a live Slack OAuth credential reaches slack.com
# with its user token (SLACK_BOT_TOKEN, swapped by iron-proxy); everyone else
# goes through Centaur's principal-scoped /api/slack/* routes. Message search
# uses company context v2 (COMPANY_CONTEXT_API_URL, with the principal API JWT
# iron-proxy injects) for every principal except Slack DM and MCP (Console
# user) principals, wherever that service is deployed.
