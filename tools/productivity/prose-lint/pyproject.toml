[project]
name = "prose-lint"
description = "Score drafts for wordiness, mannered prose, hedging, and citations with the OpenAI Decisions API"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.scripts]
prose-lint = "centaur_tool_prose_lint.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_prose_lint"

[tool.centaur]
module = "client.py"
hosts = ["api.openai.com"]
secrets = [
    { type = "http", name = "OPENAI_API_KEY", mode = "replace", hosts = ["api.openai.com"] },
]
