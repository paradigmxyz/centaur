[project]
name = "luma"
description = "Luma calendar, event, guest, contact, and webhook management"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.scripts]
luma = "centaur_tool_luma.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_luma"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "LUMA_API_KEY", mode = "inject", inject_header = "x-luma-api-key", hosts = ["public-api.luma.com"]},
]
