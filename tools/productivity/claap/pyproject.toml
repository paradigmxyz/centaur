[project]
name = "claap"
description = "Claap recordings, metadata, AI fields, and transcripts"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
claap = "claap.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "CLAAP_API_KEY", match_headers = ["X-Claap-Key"], hosts = ["api.claap.io"]},
]
