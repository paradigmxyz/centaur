[project]
name = "slack"
description = "Search Slack messages, channels, threads, users"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.30.0",
    "slack-sdk>=3.27.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "structlog>=24.4.0",
]

[project.scripts]
slack = "centaur_tool_slack.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_slack"

[tool.centaur]
module = "client.py"
optional_secrets = [
    {type = "http", name = "SLACK_SEARCH_TOKEN", mode = "inject", inject_header = "Authorization", inject_formatter = "Bearer {{ .Value }}", hosts = ["files.slack.com"]}
]

[[tool.centaur.secrets]]
type = "http"
name = "SLACK_BOT_TOKEN"
match_headers = ["Authorization"]
hosts = ["slack.com", "files.slack.com"]

[[tool.centaur.secrets]]
type = "pg_dsn"
name = "company_context_dsn"
database = "centaur"
secret_ref = "CENTAUR_POSTGRES_DSN"
role = "centaur_company_context_reader"
settings = [
    { name = "centaur.slack_channel_id", value_from = { principal_field = "slack_channel_id" } },
    { name = "centaur.slack_team_id", value_from = { principal_field = "slack_team_id" } },
    { name = "centaur.slack_history_channel_ids", value_from = { principal_field = "slack_history_channel_ids" } },
    { name = "centaur.slack_include_public", value = "true" },
    { name = "centaur.slack_user_id", value_from = { principal_field = "slack_user_id" } },
]
