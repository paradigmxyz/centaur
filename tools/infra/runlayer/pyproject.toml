[project]
name = "runlayer"
description = "Discover and use your personal Runlayer Plugin tools"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27.0", "jsonschema>=4.22.0", "referencing>=0.35.0", "typer>=0.12.0"]

[project.scripts]
runlayer = "centaur_tool_runlayer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_runlayer"

[tool.centaur]
module = "client.py"
# Personal OAuth wrapper grants inject Authorization. No shared token source.
secrets = []
