[project]
name = "chart"
description = "Render declarative Vega-Lite chart specifications to PNG or SVG"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "vl-convert-python>=1.9.0,<2",
]

[project.scripts]
chart = "centaur_tool_chart.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["centaur_tool_chart"]

[tool.centaur]
module = "centaur_tool_chart/client.py"
hosts = []
secrets = []
