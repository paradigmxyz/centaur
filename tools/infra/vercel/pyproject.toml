[project]
name = "vercel"
description = "Official Vercel CLI passthrough — deployments, logs, projects, env"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
vercel = "centaur_tool_vercel.cli:app"
vc = "centaur_tool_vercel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_vercel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.centaur]
module = "client.py"
secrets = [{type = "http", name = "VERCEL_TOKEN", match_headers = ["Authorization"], hosts = ["api.vercel.com"]}]
