[project]
name = "vega-lite"
description = "Render declarative Vega-Lite specifications to PNG or SVG"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "vl-convert-python>=1.9.0,<2",
]

[project.scripts]
vega-lite = "centaur_tool_vega_lite.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["centaur_tool_vega_lite"]

[tool.centaur]
module = "centaur_tool_vega_lite/client.py"
hosts = []
secrets = []
