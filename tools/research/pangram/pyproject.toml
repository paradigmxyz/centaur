[project]
name = "pangram"
description = "Pangram AI and plagiarism detection"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.scripts]
pangram = "pangram.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "pangram"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "PANGRAM_API_KEY", mode = "inject", inject_header = "x-api-key", hosts = ["text.external-api.pangram.com", "plagiarism.api.pangram.com"]},
]
