[project]
name = "docsend"
description = "DocSend document and deal-room downloader — Browserbase + Playwright"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "browserbase>=1.15.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "httpx>=0.28.0",
    "pillow>=12.0.0",
    "playwright==1.62.0",
    "websockets>=17.0",
]

[project.scripts]
docsend = "centaur_tool_docsend.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_docsend"

[tool.centaur]
module = "client.py"
hosts = ["track.pstmrk.it"]
secrets = [{type = "http", name = "BROWSERBASE_API_KEY", mode = "inject", inject_header = "X-BB-API-Key", hosts = ["api.browserbase.com"]}]
