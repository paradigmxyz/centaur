[project]
name = "websearch"
description = "Web search via Parallel (default, free tier), Exa, or Tako"
version = "0.3.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.scripts]
websearch = "centaur_tool_websearch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_websearch"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.centaur]
module = "client.py"
# WEBSEARCH_BACKEND (sandbox env) selects parallel (default), exa, or tako.
# Parallel falls back to its free anonymous Search MCP when PARALLEL_API_KEY is
# rejected; Exa and Tako need their key. Keep secret hosts off search.parallel.ai
# so the free path stays anonymous.
optional_secrets = [
    {type = "http", name = "PARALLEL_API_KEY", mode = "inject", inject_header = "x-api-key", hosts = ["api.parallel.ai"]},
    {type = "http", name = "EXA_API_KEY", mode = "inject", inject_header = "x-api-key", hosts = ["api.exa.ai"]},
    {type = "http", name = "TAKO_API_KEY", mode = "inject", inject_header = "X-API-Key", hosts = ["tako.com"]},
]
hosts = ["api.parallel.ai", "search.parallel.ai", "api.exa.ai", "tako.com"]
