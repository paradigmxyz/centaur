[project]
name = "mercator"
description = "Find, quote, and pay for external API calls through Mercator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.scripts]
mercator = "mercator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "mercator"

[tool.centaur]
module = "client.py"
# The Bearer token for mercator.sh is injected by the proxy from an
# operator-created token broker secret, not declared here.
hosts = ["mercator.sh"]
