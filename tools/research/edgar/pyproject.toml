[project]
name = "edgar"
description = "SEC EDGAR filings, full-text search, and XBRL financial data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.scripts]
edgar = "centaur_tool_edgar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_edgar"

[tool.centaur]
module = "client.py"
hosts = ["www.sec.gov", "data.sec.gov", "efts.sec.gov"]
secrets = []
