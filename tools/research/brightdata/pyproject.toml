[project]
name = "brightdata"
description = "BrightData MCP public web search, discovery, and scraping"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
brightdata = "brightdata.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.centaur]
module = "client.py"
timeout_s = 300
secrets = [
    {type = "http", name = "BRIGHTDATA_API_TOKEN", match_query = true, hosts = ["mcp.brightdata.com"]},
]
