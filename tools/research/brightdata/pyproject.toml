[project]
name = "brightdata"
description = "BrightData public web search and scraping (SERP + Web Unlocker)"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "centaur-sdk",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
brightdata = "cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
centaur-sdk = { path = "../../../centaur_sdk", editable = true }


[tool.centaur]
module = "client.py"
timeout_s = 300
secrets = [
    {type = "http", name = "BRIGHTDATA_API_TOKEN", match_headers = ["Authorization"], hosts = ["api.brightdata.com"]},
]
