[project]
name = "eventregistry"
description = "Event Registry CLI for recent article search"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.scripts]
eventregistry = "centaur_tool_eventregistry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_eventregistry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.centaur]
module = "client.py"
secrets = [{type = "http", name = "EVENTREGISTRY_API_KEY", mode = "inject", inject_query_param = "apiKey", hosts = ["eventregistry.org"]}]
