[project]
name = "browser-use"
description = "Browser Use cloud browsers, LLM gateway and web search"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
]

[project.scripts]
browser-use = "centaur_tool_browser_use.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_browser_use"

[tool.centaur]
module = "client.py"
# Browser Use's REST API takes the key only in X-Browser-Use-API-Key; the LLM
# gateway and search accept it there too. Code Mode's browser_use connector
# (connectors/browser_use) relies on this declaration.
secrets = [
    {type = "http", name = "BROWSER_USE_API_KEY", mode = "inject", inject_header = "X-Browser-Use-API-Key", hosts = ["api.browser-use.com"]},
]
