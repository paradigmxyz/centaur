[project]
name = "mpp"
description = "Discover and call registered MPP services through Centaur's transparent payment proxy."
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
]

[project.scripts]
mpp = "centaur_tool_mpp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_mpp"

[tool.centaur]
module = "client.py"
