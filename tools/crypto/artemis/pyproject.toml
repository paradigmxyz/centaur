[project]
name = "centaur-artemis-tool"
description = "Artemis API - crypto market data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "artemis>=0.5.0,<0.6.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
consider_namespace_packages = true

[project.scripts]
artemis = "centaur_tool_artemis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_artemis"

[tool.centaur]
module = "client.py"
secrets = [{type = "http", name = "ARTEMIS_API_KEY", mode = "inject", inject_header = "X-API-Key", hosts = ["data-svc.artemisxyz.com"]}]
