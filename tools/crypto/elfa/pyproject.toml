[project]
name = "elfa"
description = "Elfa AI event summaries from keyword mentions, with source links"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
elfa = "centaur_tool_elfa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_elfa"

[tool.centaur]
module = "client.py"
secrets = [
    {type = "http", name = "ELFA_API_KEY", mode = "inject", inject_header = "x-elfa-api-key", hosts = ["api.elfa.ai"]},
]
