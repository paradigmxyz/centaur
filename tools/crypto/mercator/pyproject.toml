[project]
name = "mercator"
description = "Discover, quote, and run paid Mercator services with explicit approval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.scripts]
mercator = "centaur_tool_mercator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_mercator"

[tool.centaur]
module = "client.py"
hosts = ["mercator.tempoxyz.dev"]
secrets = []
