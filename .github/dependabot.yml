version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: bundler
    directory: /services/console
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # rails-paradedb 0.10+ requires ParadeDB 0.25+, while Console runs 0.23.
      - dependency-name: rails-paradedb
        versions:
          - ">= 0.10.0"
    groups:
      ruby-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /services/api-rs
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      api-rs-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /crates/harness-server
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      harness-server-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
      - /services/linearbot
      - /services/slackbotv2
      - /services/discordbot
      - /services/teamsbot
      - /services/githubbot
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      typescript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      docs-dependencies:
        patterns:
          - "*"
