version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /services/api-rs
      - /services/company-context
      - /services/console
      - /services/discordbot
      - /services/githubbot
      - /services/iron-proxy
      - /services/linearbot
      - /services/proxy-sync
      - /services/sandbox
      - /services/slackbotv2
      - /services/teamsbot
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # Ubuntu LTS upgrades change apt repo codenames and system Python paths in
      # the sandbox image, so they need a deliberate migration.
      - dependency-name: ubuntu
        update-types:
          - version-update:semver-major
    groups:
      docker-base-images:
        patterns:
          - "*"

  - package-ecosystem: bundler
    directory: /services/console
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # Rails 8.1.4 is broken; see the exclusion in services/console/Gemfile.
      - dependency-name: rails
        versions:
          - "8.1.4"
    groups:
      ruby-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /services/api-rs
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      api-rs-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /crates/absurd-sdk
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      absurd-sdk-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /crates/active-record-encryption
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    groups:
      active-record-encryption-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /crates/harness-server
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # Starlark 0.13 uses hashbrown 0.14, which allocative 0.3.6+ no longer supports.
      - dependency-name: allocative
        versions:
          - ">= 0.3.6"
    groups:
      harness-server-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
      - /services/linearbot
      - /services/slackbotv2
      - /services/discordbot
      - /services/teamsbot
      - /services/githubbot
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # Chat SDK packages must stay aligned with the locally patched adapters.
      - dependency-name: "@chat-adapter/*"
      - dependency-name: chat
    groups:
      typescript-dependencies:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 5
    ignore:
      # The pinned Vocs snapshot depends on Waku's alpha plugin API.
      - dependency-name: waku
    groups:
      docs-dependencies:
        patterns:
          - "*"
