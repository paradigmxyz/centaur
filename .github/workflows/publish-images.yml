name: Publish Images

on:
  push:
    branches: [main]
    tags: [v*]
    paths:
      - .github/workflows/publish-images.yml
      - services/**
      - crates/harness-server/**
      - harness/**
      - centaur_sdk/**
      - packages/**
      - tools/**
      - scripts/bootstrap-k8s-secrets.sh
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .agents/skills/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: paradigmxyz/centaur
  IMAGE_SOURCE: https://github.com/paradigmxyz/centaur
  # Main/tags keep optimized release images. PRs and manual branch publishes
  # use debug builds so staging/dev iteration does not spend minutes optimizing
  # Rust binaries that are immediately replaced by the next test build.
  RUST_BUILD_PROFILE: ${{ (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && 'debug' || 'release' }}

jobs:
  # Build each image with Depot's hosted builders, push by digest, and hand
  # the digests to the merge job below which assembles the multi-arch manifest.
  # arm64 is only built on pushes to main and release tags — PR and manual
  # dispatch builds stay amd64-only to keep iteration fast.
  build:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'depot-ubuntu-24.04-arm-16' || 'depot-ubuntu-24.04-16' }}
    strategy:
      fail-fast: false
      matrix:
        service: [api-rs, slackbotv2, linearbot, discordbot, githubbot, teamsbot, agent, iron-proxy, console]
        platform: ${{ github.event_name == 'push' && fromJSON('["linux/amd64", "linux/arm64"]') || fromJSON('["linux/amd64"]') }}
        include:
          - service: api-rs
            image: centaur-api-rs
            context: .
            dockerfile: services/api-rs/Dockerfile
            target: ""
          - service: slackbotv2
            image: centaur-slackbotv2
            context: .
            dockerfile: services/slackbotv2/Dockerfile
            target: ""
          - service: linearbot
            image: centaur-linearbot
            context: .
            dockerfile: services/linearbot/Dockerfile
            target: ""
          - service: discordbot
            image: centaur-discordbot
            context: .
            dockerfile: services/discordbot/Dockerfile
            target: ""
          - service: githubbot
            image: centaur-githubbot
            context: .
            dockerfile: services/githubbot/Dockerfile
            target: ""
          - service: teamsbot
            image: centaur-teamsbot
            context: .
            dockerfile: services/teamsbot/Dockerfile
            target: ""
          - service: agent
            image: centaur-agent
            context: .
            dockerfile: services/sandbox/Dockerfile
            target: sandbox
          - service: iron-proxy
            image: centaur-iron-proxy
            context: .
            dockerfile: services/iron-proxy/Dockerfile
            target: ""
          - service: console
            image: centaur-console
            context: services/console
            dockerfile: services/console/Dockerfile
            target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Derive platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_SLUG=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Depot
        uses: depot/setup-action@15c09a5f77a0840ad4bce955686522a257853461 # v1.7.1

      - name: Set up Docker Buildx for fork fallback
        if: ${{ github.event.pull_request.head.repo.fork }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true

      - name: Build and push ${{ matrix.image }} (${{ matrix.platform }})
        id: build
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: d8qqlh1bmq
          # Depot's public-fork OIDC may be unavailable even when the source is
          # valid. Fork PRs never push, so fall back to the local Buildx builder
          # instead of turning external Depot auth into a code-review failure.
          buildx-fallback: ${{ github.event.pull_request.head.repo.fork }}
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Tags are applied by the merge job on the multi-arch manifest;
          # per-arch builds are pushed by digest only. Fork PRs run with a
          # read-only GITHUB_TOKEN, so they build without pushing.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=${{ !github.event.pull_request.head.repo.fork }}
          build-args: |
            RUST_BUILD_PROFILE=${{ env.RUST_BUILD_PROFILE }}

      - name: Export digest
        if: ${{ !github.event.pull_request.head.repo.fork }}
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: depot-ubuntu-24.04-16
    needs: build
    if: ${{ !github.event.pull_request.head.repo.fork }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: centaur-api-rs
            attest: true
          - image: centaur-slackbotv2
          - image: centaur-linearbot
          - image: centaur-agent
            attest: true
          - image: centaur-iron-proxy
          - image: centaur-console
          - image: centaur-discordbot
          - image: centaur-githubbot
          - image: centaur-teamsbot

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.image }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for ${{ matrix.image }}
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,prefix=main-sha-,enable={{is_default_branch}}
            type=semver,pattern={{raw}}
            type=ref,event=pr
            type=sha
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.source=${{ env.IMAGE_SOURCE }}
            org.opencontainers.image.revision=${{ github.sha }}
        env:
          DOCKER_METADATA_PR_HEAD_SHA: true

      - name: Create multi-arch manifest for ${{ matrix.image }}
        id: manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -er '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          mapfile -t digest_files < <(printf '%s\n' * | sort)
          ((${#tags[@]} > 0))
          ((${#digest_files[@]} > 0))

          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          sources=()
          for digest_file in "${digest_files[@]}"; do
            [[ "$digest_file" =~ ^[0-9a-f]{64}$ ]]
            sources+=("${IMAGE_NAME}@sha256:${digest_file}")
          done

          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${SOURCE_SHA}" \
            "${tag_args[@]}" \
            "${sources[@]}"

          manifest_json="$(
            docker buildx imagetools inspect \
              "${IMAGE_NAME}:${{ steps.meta.outputs.version }}" \
              --format '{{json .Manifest}}'
          )"
          digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest_json")"
          jq -e --arg source_sha "$SOURCE_SHA" \
            '.annotations["org.opencontainers.image.revision"] == $source_sha' \
            <<< "$manifest_json" >/dev/null

          if [[ "${{ github.event_name }}" == "push" ]]; then
            expected_platforms='["linux/amd64", "linux/arm64"]'
          else
            expected_platforms='["linux/amd64"]'
          fi
          jq -e --argjson expected "$expected_platforms" '
            [
              .manifests[]
              | select(.platform.os == "linux")
              | {name: "\(.platform.os)/\(.platform.architecture)", digest}
            ] as $runtime
            | ([$runtime[].name] | sort) == ($expected | sort)
              and all(.manifests[];
                . as $descriptor
                | if $descriptor.platform.os == "linux" then
                  any($runtime[]; .digest == $descriptor.digest)
                else
                  $descriptor.platform.os == "unknown"
                  and $descriptor.platform.architecture == "unknown"
                  and $descriptor.annotations["vnd.docker.reference.type"] == "attestation-manifest"
                  and any($runtime[];
                    .digest == $descriptor.annotations["vnd.docker.reference.digest"])
                end
              )
          ' <<< "$manifest_json" >/dev/null

          image_json="$(
            docker buildx imagetools inspect \
              "${IMAGE_NAME}@${digest}" \
              --format '{{json .Image}}'
          )"
          jq -e --arg source_sha "$SOURCE_SHA" '
            to_entries
            | length > 0 and all(
                .value.config.Labels["org.opencontainers.image.revision"] == $source_sha
              )
          ' <<< "$image_json" >/dev/null

          echo "image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Published ${IMAGE_NAME}@${digest} from ${SOURCE_SHA}"

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect \
            "${{ steps.manifest.outputs.image }}@${{ steps.manifest.outputs.digest }}"

      - name: Set up Syft
        if: ${{ matrix.attest }}
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.48.0

      - name: Generate platform SBOMs
        if: ${{ matrix.attest }}
        env:
          IMAGE_REF: ${{ steps.manifest.outputs.image }}@${{ steps.manifest.outputs.digest }}
          SBOM_DIR: ${{ runner.temp }}/sboms
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          mkdir -p "$SBOM_DIR"
          "$SYFT_CMD" scan "$IMAGE_REF" \
            --platform linux/amd64 \
            --output "spdx-json=${SBOM_DIR}/linux-amd64.spdx.json"
          if [[ "${{ github.event_name }}" == "push" ]]; then
            "$SYFT_CMD" scan "$IMAGE_REF" \
              --platform linux/arm64 \
              --output "spdx-json=${SBOM_DIR}/linux-arm64.spdx.json"
          fi

      - name: Attest SLSA build provenance
        if: ${{ matrix.attest }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Attest linux/amd64 SBOM
        if: ${{ matrix.attest }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sboms/linux-amd64.spdx.json
          push-to-registry: true

      - name: Attest linux/arm64 SBOM
        if: ${{ matrix.attest && github.event_name == 'push' }}
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-name: ${{ steps.manifest.outputs.image }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: ${{ runner.temp }}/sboms/linux-arm64.spdx.json
          push-to-registry: true
