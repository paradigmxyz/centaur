name: Console CI

on:
  pull_request:
  merge_group:
  push:
    branches: [ main ]

jobs:
  console_changes:
    name: Detect Console CI changes
    runs-on: depot-ubuntu-24.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Detect changed paths
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed_files="$(git diff --name-only "${base}...HEAD")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}...HEAD")"
          else
            git fetch --no-tags --depth=1 origin main
            changed_files="$(git diff --name-only origin/main...HEAD)"
          fi

          if printf '%s\n' "${changed_files}" | grep -Eq '^(services/console/|\.github/workflows/console-ci\.yml$|pnpm-lock\.yaml$|package\.json$|pnpm-workspace\.yaml$)'; then
            echo "relevant=true" >>"${GITHUB_OUTPUT}"
          else
            echo "relevant=false" >>"${GITHUB_OUTPUT}"
          fi

  web:
    name: Console web (typecheck, lint, test, build)
    runs-on: depot-ubuntu-24.04-16
    needs: console_changes
    if: needs.console_changes.outputs.relevant == 'true'
    defaults:
      run:
        working-directory: services/console/web
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.9
          run_install: false

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile --filter @centaur/console-web

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  console-ci-success:
    name: Console CI success
    runs-on: depot-ubuntu-24.04
    if: always()
    needs:
      - console_changes
      - web
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: web
          jobs: ${{ toJSON(needs) }}
