name: Console CI

on:
  pull_request:
  merge_group:
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: services/console

jobs:
  console_changes:
    name: Detect Console CI changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Detect changed paths
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed_files="$(git diff --name-only "${base}...HEAD")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}...HEAD")"
          else
            git fetch --no-tags --depth=1 origin main
            changed_files="$(git diff --name-only origin/main...HEAD)"
          fi

          if printf '%s\n' "${changed_files}" | grep -Eq '^(services/console/|\.github/workflows/console-ci\.yml$)'; then
            echo "relevant=true" >>"${GITHUB_OUTPUT}"
          else
            echo "relevant=false" >>"${GITHUB_OUTPUT}"
          fi

  scan_ruby:
    runs-on: depot-ubuntu-24.04-16
    needs: console_changes
    if: needs.console_changes.outputs.relevant == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: services/console
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    runs-on: depot-ubuntu-24.04-16
    needs: console_changes
    if: needs.console_changes.outputs.relevant == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: services/console
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: depot-ubuntu-24.04-16
    needs: console_changes
    if: needs.console_changes.outputs.relevant == 'true'
    env:
      RUBOCOP_CACHE_ROOT: ${{ github.workspace }}/services/console/tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: services/console
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('services/console/.ruby-version', 'services/console/**/.rubocop.yml', 'services/console/**/.rubocop_todo.yml', 'services/console/Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: depot-ubuntu-24.04-16
    needs: console_changes
    if: needs.console_changes.outputs.relevant == 'true'

    services:
      postgres:
        image: paradedb/paradedb:0.23.0-pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: services/console
          bundler-cache: true

      - name: Verify migrations match the checked-in schema
        env:
          RAILS_ENV: test
          IRON_CONTROL_DB_HOST: localhost
          IRON_CONTROL_DB_PORT: 5432
          IRON_CONTROL_DB_USERNAME: postgres
          IRON_CONTROL_DB_PASSWORD: postgres
        run: |
          bin/rails db:create db:migrate
          git diff --exit-code -- db/schema.rb

      - name: Run tests
        env:
          RAILS_ENV: test
          IRON_CONTROL_DB_HOST: localhost
          IRON_CONTROL_DB_PORT: 5432
          IRON_CONTROL_DB_USERNAME: postgres
          IRON_CONTROL_DB_PASSWORD: postgres
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
        run: bin/rails db:test:prepare test

  console-ci-success:
    name: Console CI success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - console_changes
      - scan_ruby
      - scan_js
      - lint
      - test
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-skips: scan_ruby, scan_js, lint, test
          jobs: ${{ toJSON(needs) }}
