name: E2E

# Deploys published images to a kind cluster and runs the e2e/ scenarios: real
# control plane, sandboxes, and harnesses against a fake Slack and a scripted
# model server, with API keys. e2e-subscription-harnesses runs only the harness
# smoke test with ChatGPT/Claude.ai subscriptions, since harness upgrades can
# break that path on its own. Both informational.
#
# Publish Images calls this after pushing images. Run it manually to re-test an
# already-published tag without republishing; the scenarios come from the
# dispatched ref.
on:
  workflow_call:
    inputs:
      image_tag:
        description: Published image tag to test. Defaults to sha-<short head sha>.
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published image tag to test (e.g. main, sha-abc1234). Defaults to sha-<short sha of the dispatched ref>.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.name }}
    runs-on: depot-ubuntu-24.04-16
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: e2e
            auth-mode: api_key
            tests: ""
          - name: e2e-subscription-harnesses
            auth-mode: access_token
            tests: e2e/tests/harnesses.test.ts
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      CENTAUR_E2E_AUTH_MODE: ${{ matrix.auth-mode }}
      CENTAUR_E2E_LOG_DIR: ${{ github.workspace }}/e2e-logs
      E2E_TESTS: ${{ matrix.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
          version: v0.30.0

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Deploy the e2e stack
        run: CENTAUR_E2E_IMAGE_TAG="${IMAGE_TAG:-sha-${HEAD_SHA::7}}" e2e/stack.sh up

      - name: Run e2e scenarios
        run: e2e/stack.sh test $E2E_TESTS

      - name: Dump diagnostics
        if: ${{ failure() }}
        run: e2e/stack.sh logs

      - name: Upload e2e logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-logs
          path: e2e-logs/
          if-no-files-found: ignore
          retention-days: 14
