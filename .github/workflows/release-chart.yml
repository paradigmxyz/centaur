name: Release Chart

"on":
  pull_request:
    branches:
      - main
    paths:
      - "contrib/chart/**"
      - ".github/workflows/release-chart.yml"
  merge_group:
  push:
    branches:
      - main
    paths:
      - "contrib/chart/**"
      - ".github/workflows/release-chart.yml"

permissions: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Bootstrap gh-pages branch
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch already exists"
          else
            echo "Creating empty gh-pages branch"
            git switch --orphan gh-pages
            git commit --allow-empty -m "chore: initialize gh-pages"
            git push origin gh-pages
            git switch -
          fi

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.1

      - name: Add chart repositories
        run: helm repo add onepassword https://1password.github.io/connect-helm-charts

      - name: Build chart dependencies
        run: helm dependency build contrib/chart

      - name: Lint chart
        run: helm lint contrib/chart

      # chart-version.yml bumps the version in its own PR, so chart changes
      # merged before that bump reuse an already-released version. Publish
      # only versions that have no release tag yet.
      - name: Check for unreleased chart version
        id: version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" { print $2; exit }' contrib/chart/Chart.yaml)"
          if git rev-parse -q --verify "refs/tags/centaur-${version}" >/dev/null; then
            echo "Chart ${version} is already released"
            echo "unreleased=false" >>"${GITHUB_OUTPUT}"
          else
            echo "unreleased=true" >>"${GITHUB_OUTPUT}"
          fi

      - name: Run chart-releaser
        if: steps.version.outputs.unreleased == 'true'
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          skip_existing: true
          mark_as_latest: false
          charts_dir: contrib
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
