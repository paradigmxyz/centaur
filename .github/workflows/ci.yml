name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci_changes:
    name: Detect CI changes
    runs-on: ubuntu-latest
    outputs:
      migration_order: ${{ steps.filter.outputs.migration_order }}
      harness_server_checks: ${{ steps.filter.outputs.harness_server_checks }}
      company_context_checks: ${{ steps.filter.outputs.company_context_checks }}
      rust_api: ${{ steps.filter.outputs.rust_api }}
      proxy_sync_checks: ${{ steps.filter.outputs.proxy_sync_checks }}
      sandbox_tests: ${{ steps.filter.outputs.sandbox_tests }}
      workflow_python_tests: ${{ steps.filter.outputs.workflow_python_tests }}
      tool_tests: ${{ steps.filter.outputs.tool_tests }}
      slackbotv2_tests: ${{ steps.filter.outputs.slackbotv2_tests }}
      discordbot_checks: ${{ steps.filter.outputs.discordbot_checks }}
      githubbot_checks: ${{ steps.filter.outputs.githubbot_checks }}
      teamsbot_checks: ${{ steps.filter.outputs.teamsbot_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Detect changed paths
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed_files="$(git diff --name-only "${base}...HEAD")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            changed_files="$(git diff --name-only "${base}...HEAD")"
          else
            git fetch --no-tags --depth=1 origin main
            base="origin/main"
            changed_files="$(git diff --name-only "${base}...HEAD")"
          fi

          matches() {
            local pattern
            for pattern in "$@"; do
              if printf '%s\n' "${changed_files}" | grep -Eq "${pattern}"; then
                return 0
              fi
            done
            return 1
          }

          # Print a chart file without YAML/template comments and blank lines.
          strip_chart_comments() {
            case "$1" in
              *.yaml | *.yml | *.tpl)
                perl -0pe 's/\{\{-?\s*\/\*.*?\*\/\s*-?\}\}//gs; s/^[ \t]*#.*(\n|\z)//mg; s/^[ \t]*(\n|\z)//mg'
                ;;
              *) cat ;;
            esac
          }

          chart_changed() {
            local file
            while IFS= read -r file; do
              [[ -n "${file}" ]] || continue
              if ! cmp -s \
                <(git show "${base}:${file}" 2>/dev/null | strip_chart_comments "${file}") \
                <(git show "HEAD:${file}" 2>/dev/null | strip_chart_comments "${file}"); then
                return 0
              fi
            done < <(git diff --name-only --no-renames "${base}...HEAD" -- contrib/chart/)
            return 1
          }

          if chart_changed; then
            chart_yaml="contrib/chart/Chart.yaml"
            previous_version="$(git show "${base}:${chart_yaml}" | awk '$1 == "version:" { print $2; exit }')"
            current_version="$(awk '$1 == "version:" { print $2; exit }' "${chart_yaml}")"

            if [[ -z "${previous_version}" || -z "${current_version}" ]]; then
              echo "::error file=${chart_yaml}::Could not read chart version"
              exit 1
            fi

            if [[ "${current_version}" == "${previous_version}" ]]; then
              echo "::error file=${chart_yaml}::contrib/chart changed but chart version stayed at ${current_version}. Bump .version in the PR."
              exit 1
            fi
          fi

          set_output() {
            local name="$1"
            shift
            if matches "$@"; then
              echo "${name}=true" >>"${GITHUB_OUTPUT}"
            else
              echo "${name}=false" >>"${GITHUB_OUTPUT}"
            fi
          }

          set_output migration_order \
            '^services/api-rs/crates/centaur-session-sqlx/migrations/' \
            '^services/api-rs/crates/centaur-session-sqlx/search-migrations/' \
            '^services/console/db/migrate/' \
            '^\.github/scripts/check-migration-order\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output harness_server_checks \
            '^crates/harness-server/' \
            '^\.github/workflows/ci\.yml$'
          set_output company_context_checks \
            '^crates/absurd-sdk/' \
            '^crates/active-record-encryption/' \
            '^services/company-context/' \
            '^\.github/scripts/start-test-postgres\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output proxy_sync_checks \
            '^crates/active-record-encryption/' \
            '^services/proxy-sync/' \
            '^services/console/' \
            '^\.github/scripts/start-test-postgres\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output rust_api \
            '^crates/absurd-sdk/' \
            '^services/api-rs/' \
            '^\.github/scripts/start-test-postgres\.sh$' \
            '^services/workflow-python/' \
            '^workflows/' \
            '^\.github/workflows/ci\.yml$'
          set_output sandbox_tests \
            '^services/sandbox/' \
            '^\.github/workflows/ci\.yml$'
          set_output workflow_python_tests \
            '^services/workflow-python/' \
            '^workflows/' \
            '^\.github/workflows/ci\.yml$'
          set_output tool_tests \
            '^tools/' \
            '^centaur_sdk/' \
            '^\.github/scripts/run-tool-tests\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output slackbotv2_tests \
            '^services/slackbotv2/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^patches/' \
            '^\.github/workflows/ci\.yml$'
          set_output discordbot_checks \
            '^services/discordbot/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'
          set_output githubbot_checks \
            '^services/githubbot/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'
          set_output teamsbot_checks \
            '^services/teamsbot/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'

  migration-order:
    name: Migration order
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.migration_order == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check migration versions
        run: .github/scripts/check-migration-order.sh "origin/${{ github.base_ref || 'main' }}"

  harness-server-checks:
    name: Harness server fmt, clippy, and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.harness_server_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/harness-server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        working-directory: crates/harness-server
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: crates/harness-server
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: crates/harness-server
        run: cargo test --locked

  company-context-checks:
    name: Company context fmt, clippy, and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.company_context_checks == 'true'
    defaults:
      run:
        working-directory: services/company-context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/absurd-sdk
            crates/active-record-encryption
            services/company-context

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Start Test Postgres
        working-directory: .
        run: .github/scripts/start-test-postgres.sh company-context-test-postgres 5432 postgres

      - name: Test
        env:
          COMPANY_CONTEXT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked

  proxy-sync-checks:
    name: Proxy sync fmt, clippy, and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.proxy_sync_checks == 'true'
    defaults:
      run:
        working-directory: services/proxy-sync
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/active-record-encryption
            services/proxy-sync
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format Active Record encryption crate
        working-directory: crates/active-record-encryption
        run: cargo fmt --all --check

      - name: Clippy Active Record encryption crate
        working-directory: crates/active-record-encryption
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Active Record encryption crate
        working-directory: crates/active-record-encryption
        run: cargo test --locked

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build parity test server
        run: cargo build --locked

      - name: Start parity database
        working-directory: .
        run: .github/scripts/start-test-postgres.sh proxy-sync-parity-postgres 5432 proxy_sync_parity_test

      - name: Install Console packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips libpq-dev

      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          working-directory: services/console
          bundler-cache: true

      - name: Compare Rails and Rust sync responses
        working-directory: services/console
        env:
          RAILS_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proxy_sync_parity_test
          PROXY_SYNC_BINARY: ../proxy-sync/target/debug/centaur-proxy-sync
        run: |
          export CENTAUR_CONSOLE_DATABASE_URL="$DATABASE_URL"
          bin/rails db:prepare
          bin/rails test ../proxy-sync/tests/rails_parity_test.rb --verbose

  rust-api:
    name: Rust API fmt, clippy, and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.rust_api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Test Postgres
        run: .github/scripts/start-test-postgres.sh centaur-api-test-postgres 5432 centaur

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/absurd-sdk
            services/api-rs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format Absurd SDK
        working-directory: crates/absurd-sdk
        run: cargo fmt --all --check

      - name: Clippy Absurd SDK
        working-directory: crates/absurd-sdk
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test Absurd SDK
        working-directory: crates/absurd-sdk
        env:
          ABSURD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/absurd_sdk
        run: |
          docker exec centaur-api-test-postgres createdb -U postgres absurd_sdk
          docker exec -i centaur-api-test-postgres \
            psql -v ON_ERROR_STOP=1 -U postgres -d absurd_sdk \
            < ../../services/api-rs/crates/centaur-session-sqlx/migrations/0007_absurd_workflows.sql
          cargo test --locked -- --test-threads=1

      - name: Format
        working-directory: services/api-rs
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: services/api-rs
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: services/api-rs
        env:
          SESSION_SQLX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          cargo test --workspace

          PGPASSWORD=postgres createdb --host localhost --username postgres session_runtime
          SESSION_RUNTIME_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/session_runtime \
            cargo test -p centaur-session-runtime -- --test-threads=1

      - name: Cleanup Test Postgres
        if: ${{ always() }}
        run: docker rm -f centaur-api-test-postgres || true

  rust-api-postgres:
    name: Rust API migrations on PostgreSQL
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.rust_api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Test Postgres
        run: .github/scripts/start-test-postgres.sh centaur-api-plain-postgres 5432 postgres pgvector

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: services/api-rs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Core migrations and the postgres text-search backend must not need
      # ParadeDB. The rust-api job covers both backends on ParadeDB.
      - name: Test SQLx migrations
        working-directory: services/api-rs
        env:
          SESSION_SQLX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked -p centaur-session-sqlx

      - name: Cleanup Test Postgres
        if: ${{ always() }}
        run: docker rm -f centaur-api-plain-postgres || true

  sandbox-tests:
    name: Sandbox Python tests
    runs-on: ubuntu-latest
    needs: ci_changes
    if: needs.ci_changes.outputs.sandbox_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Tool-host integration tests execute real CLIs through uvx.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Sandbox Python tests
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s services/sandbox -p 'test_*.py'

  workflow-python-tests:
    name: Workflow Python tests
    runs-on: ubuntu-latest
    needs: ci_changes
    if: needs.ci_changes.outputs.workflow_python_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: services/workflow-python/pyproject.toml

      - name: Workflow host tests
        run: >-
          uv run --project services/workflow-python
          python -m unittest discover
          -s services/workflow-python/tests
          -p 'test_*.py'

      - name: Workflow definition tests
        run: >-
          uv run --project services/workflow-python --with pytest
          python -m pytest workflows/tests workflows/slack/tests

  tool-tests:
    name: Tool tests
    runs-on: ubuntu-latest
    needs: ci_changes
    if: needs.ci_changes.outputs.tool_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: tools/**/pyproject.toml

      - name: Run tool tests
        run: .github/scripts/run-tool-tests.sh

  slackbotv2-tests:
    name: Slackbot v2 tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.slackbotv2_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Slackbot v2 tests
        working-directory: services/slackbotv2
        run: bun test test

  linearbot-tests:
    name: Linearbot typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: services/linearbot
        run: bun run check:types

      - name: Linearbot tests
        working-directory: services/linearbot
        run: bun test test

  discordbot-checks:
    name: Discordbot typecheck and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.discordbot_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Workspace-root install: discordbot links @centaur/* workspace packages
      # and relies on the root pnpm patches.
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Discordbot
        working-directory: services/discordbot
        run: bun run check:types

      - name: Discordbot tests
        working-directory: services/discordbot
        run: bun run test

  githubbot-checks:
    name: Githubbot typecheck and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.githubbot_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Workspace-root install: githubbot links @centaur/* workspace packages
      # and relies on the root pnpm patches.
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Githubbot
        working-directory: services/githubbot
        run: bun run check:types

      - name: Githubbot tests
        working-directory: services/githubbot
        run: bun run test

  teamsbot-checks:
    name: Teamsbot typecheck and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.teamsbot_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Teamsbot
        working-directory: services/teamsbot
        run: bun run check:types

      - name: Teamsbot tests
        working-directory: services/teamsbot
        run: bun run test

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - ci_changes
      - migration-order
      - harness-server-checks
      - company-context-checks
      - proxy-sync-checks
      - rust-api
      - rust-api-postgres
      - sandbox-tests
      - workflow-python-tests
      - tool-tests
      - slackbotv2-tests
      - discordbot-checks
      - githubbot-checks
      - teamsbot-checks
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          allowed-skips: migration-order, harness-server-checks, company-context-checks, proxy-sync-checks, rust-api, rust-api-postgres, sandbox-tests, workflow-python-tests, tool-tests, slackbotv2-tests, discordbot-checks, githubbot-checks, teamsbot-checks
          jobs: ${{ toJSON(needs) }}
