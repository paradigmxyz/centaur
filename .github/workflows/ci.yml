name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci_changes:
    name: Detect CI changes
    runs-on: depot-ubuntu-24.04
    outputs:
      migration_order: ${{ steps.filter.outputs.migration_order }}
      rust_checks: ${{ steps.filter.outputs.rust_checks }}
      harness_server_checks: ${{ steps.filter.outputs.harness_server_checks }}
      company_context_checks: ${{ steps.filter.outputs.company_context_checks }}
      rust_api: ${{ steps.filter.outputs.rust_api }}
      proxy_sync_checks: ${{ steps.filter.outputs.proxy_sync_checks }}
      token_broker_checks: ${{ steps.filter.outputs.token_broker_checks }}
      sandbox_tests: ${{ steps.filter.outputs.sandbox_tests }}
      workflow_python_tests: ${{ steps.filter.outputs.workflow_python_tests }}
      tool_tests: ${{ steps.filter.outputs.tool_tests }}
      slackbotv2_tests: ${{ steps.filter.outputs.slackbotv2_tests }}
      discordbot_checks: ${{ steps.filter.outputs.discordbot_checks }}
      githubbot_checks: ${{ steps.filter.outputs.githubbot_checks }}
      teamsbot_checks: ${{ steps.filter.outputs.teamsbot_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Detect changed paths
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed_files="$(git diff --name-only "${base}...HEAD")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            changed_files="$(git diff --name-only "${base}...HEAD")"
          else
            git fetch --no-tags --depth=1 origin main
            base="origin/main"
            changed_files="$(git diff --name-only "${base}...HEAD")"
          fi

          matches() {
            local pattern
            for pattern in "$@"; do
              if printf '%s\n' "${changed_files}" | grep -Eq "${pattern}"; then
                return 0
              fi
            done
            return 1
          }

          # Print a chart file without YAML/template comments and blank lines.
          strip_chart_comments() {
            case "$1" in
              *.yaml | *.yml | *.tpl)
                perl -0pe 's/\{\{-?\s*\/\*.*?\*\/\s*-?\}\}//gs; s/^[ \t]*#.*(\n|\z)//mg; s/^[ \t]*(\n|\z)//mg'
                ;;
              *) cat ;;
            esac
          }

          chart_changed() {
            local file
            while IFS= read -r file; do
              [[ -n "${file}" ]] || continue
              if ! cmp -s \
                <(git show "${base}:${file}" 2>/dev/null | strip_chart_comments "${file}") \
                <(git show "HEAD:${file}" 2>/dev/null | strip_chart_comments "${file}"); then
                return 0
              fi
            done < <(git diff --name-only --no-renames "${base}...HEAD" -- contrib/chart/)
            return 1
          }

          if chart_changed; then
            chart_yaml="contrib/chart/Chart.yaml"
            previous_version="$(git show "${base}:${chart_yaml}" | awk '$1 == "version:" { print $2; exit }')"
            current_version="$(awk '$1 == "version:" { print $2; exit }' "${chart_yaml}")"

            if [[ -z "${previous_version}" || -z "${current_version}" ]]; then
              echo "::error file=${chart_yaml}::Could not read chart version"
              exit 1
            fi

            if [[ "${current_version}" == "${previous_version}" ]]; then
              echo "::error file=${chart_yaml}::contrib/chart changed but chart version stayed at ${current_version}. Bump .version in the PR."
              exit 1
            fi
          fi

          set_output() {
            local name="$1"
            shift
            if matches "$@"; then
              echo "${name}=true" >>"${GITHUB_OUTPUT}"
            else
              echo "${name}=false" >>"${GITHUB_OUTPUT}"
            fi
          }

          set_output migration_order \
            '^crates/centaur-session-sqlx/migrations/' \
            '^crates/centaur-session-sqlx/search-migrations/' \
            '^services/console/db/migrate/' \
            '^\.github/scripts/check-migration-order\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output rust_checks \
            '^Cargo\.(toml|lock)$' \
            '^crates/' \
            '^\.github/workflows/ci\.yml$'
          set_output harness_server_checks \
            '^Cargo\.(toml|lock)$' \
            '^crates/harness-server/' \
            '^crates/harness-server-conformance/' \
            '^\.github/workflows/ci\.yml$'
          set_output company_context_checks \
            '^Cargo\.(toml|lock)$' \
            '^crates/absurd-sdk/' \
            '^crates/active-record-encryption/' \
            '^crates/centaur-company-context/' \
            '^\.github/scripts/start-test-postgres\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output proxy_sync_checks \
            '^Cargo\.(toml|lock)$' \
            '^crates/active-record-encryption/' \
            '^crates/centaur-proxy-sync/' \
            '^crates/centaur-console-db/' \
            '^services/console/' \
            '^\.github/scripts/start-test-postgres\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output token_broker_checks \
            '^Cargo\.(toml|lock)$' \
            '^crates/active-record-encryption/' \
            '^crates/centaur-token-broker/' \
            '^services/console/' \
            '^\.github/scripts/start-test-postgres\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output rust_api \
            '^Cargo\.(toml|lock)$' \
            '^crates/absurd-sdk/' \
            '^crates/active-record-encryption/' \
            '^crates/centaur-' \
            '^services/api-rs/' \
            '^\.github/scripts/start-test-postgres\.sh$' \
            '^services/workflow-python/' \
            '^workflows/' \
            '^\.github/workflows/ci\.yml$'
          set_output sandbox_tests \
            '^services/sandbox/' \
            '^\.github/workflows/ci\.yml$'
          set_output workflow_python_tests \
            '^services/workflow-python/' \
            '^workflows/' \
            '^\.github/workflows/ci\.yml$'
          set_output tool_tests \
            '^tools/' \
            '^centaur_sdk/' \
            '^\.github/scripts/run-tool-tests\.sh$' \
            '^\.github/scripts/start-test-postgres\.sh$' \
            '^crates/centaur-session-sqlx/(search-)?migrations/' \
            '^crates/centaur-company-context/migrations/' \
            '^services/iron-proxy/Dockerfile$' \
            '^\.github/workflows/ci\.yml$'
          set_output slackbotv2_tests \
            '^services/slackbotv2/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^patches/' \
            '^\.github/workflows/ci\.yml$'
          set_output discordbot_checks \
            '^services/discordbot/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'
          set_output githubbot_checks \
            '^services/githubbot/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'
          set_output teamsbot_checks \
            '^services/teamsbot/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'

  migration-order:
    name: Migration order
    runs-on: depot-ubuntu-24.04
    needs: ci_changes
    if: needs.ci_changes.outputs.migration_order == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check migration versions
        run: .github/scripts/check-migration-order.sh "origin/${{ github.base_ref || 'main' }}"

  rust-checks:
    name: Rust fmt and clippy
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.rust_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  harness-server-checks:
    name: Harness server tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.harness_server_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test
        run: cargo test --locked -p harness-server

  harness-server-conformance:
    name: Harness server Codex protocol conformance
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.harness_server_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/harness-server-conformance
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        working-directory: crates/harness-server-conformance
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: crates/harness-server-conformance
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: crates/harness-server-conformance
        run: cargo test --locked

  company-context-checks:
    name: Company context tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.company_context_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Start Test Postgres
        run: .github/scripts/start-test-postgres.sh company-context-test-postgres 5432 postgres

      - name: Test
        env:
          COMPANY_CONTEXT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked -p centaur-company-context

  proxy-sync-checks:
    name: Proxy sync tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.proxy_sync_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test Active Record encryption crate
        run: cargo test --locked -p active-record-encryption

      - name: Start test database
        run: .github/scripts/start-test-postgres.sh proxy-sync-test-postgres 5432 proxy_sync_test pgvector

      - name: Install Console packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips libpq-dev

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          working-directory: services/console
          bundler-cache: true

      # proxy-sync reads Console's tables directly, so its integration tests
      # run against the schema Console currently ships.
      - name: Load Console schema
        working-directory: services/console
        env:
          RAILS_ENV: test
          CENTAUR_CONSOLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proxy_sync_test
        run: bin/rails db:prepare

      - name: Test Console database crate
        env:
          CONSOLE_DB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proxy_sync_test
        run: cargo test --locked -p centaur-console-db

      - name: Test
        env:
          PROXY_SYNC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proxy_sync_test
        run: cargo test --locked -p centaur-proxy-sync

  token-broker-checks:
    name: Token broker tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.token_broker_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start test database
        run: .github/scripts/start-test-postgres.sh token-broker-test-postgres 5432 token_broker_test pgvector

      - name: Install Console packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips libpq-dev

      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          working-directory: services/console
          bundler-cache: true

      # token-broker reads and writes Console's tables directly, so its
      # integration tests run against the schema Console currently ships.
      - name: Load Console schema
        working-directory: services/console
        env:
          RAILS_ENV: test
          CENTAUR_CONSOLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/token_broker_test
        run: bin/rails db:prepare

      - name: Test
        env:
          TOKEN_BROKER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/token_broker_test
        run: cargo test --locked -p centaur-token-broker

      # The tests store tokens encrypted by token-broker; Console must read them.
      - name: Decrypt token-broker's writes with Console
        working-directory: services/console
        env:
          RAILS_ENV: test
          CENTAUR_CONSOLE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/token_broker_test
        run: |
          bin/rails runner '
            credentials = BrokerCredential.where.not(access_token: nil).to_a
            abort "token-broker tests stored no tokens" if credentials.empty?
            credentials.each { |credential| [credential.access_token, credential.refresh_token] }
            puts "Console decrypted #{credentials.size} credentials token-broker wrote"'

  rust-api:
    name: Rust API tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.rust_api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Test Postgres
        run: .github/scripts/start-test-postgres.sh centaur-api-test-postgres 5432 centaur

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test Absurd SDK
        env:
          ABSURD_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/absurd_sdk
        run: |
          docker exec centaur-api-test-postgres createdb -U postgres absurd_sdk
          docker exec -i centaur-api-test-postgres \
            psql -v ON_ERROR_STOP=1 -U postgres -d absurd_sdk \
            < crates/centaur-session-sqlx/migrations/0007_absurd_workflows.sql
          cargo test --locked -p absurd-sdk -- --test-threads=1

      # Every workspace crate not covered by its own service job above.
      - name: Test
        env:
          SESSION_SQLX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: |
          cargo test --locked --workspace \
            --exclude absurd-sdk \
            --exclude active-record-encryption \
            --exclude harness-server \
            --exclude centaur-company-context \
            --exclude centaur-proxy-sync \
            --exclude centaur-token-broker \
            --exclude centaur-console-db

          PGPASSWORD=postgres createdb --host localhost --username postgres session_runtime
          SESSION_RUNTIME_TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/session_runtime \
            cargo test --locked -p centaur-session-runtime -- --test-threads=1

      - name: Cleanup Test Postgres
        if: ${{ always() }}
        run: docker rm -f centaur-api-test-postgres || true

  rust-api-postgres:
    name: Rust API migrations on PostgreSQL
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.rust_api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Test Postgres
        run: .github/scripts/start-test-postgres.sh centaur-api-plain-postgres 5432 postgres pgvector

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Core migrations and the postgres text-search backend must not need
      # ParadeDB. The rust-api job covers both backends on ParadeDB.
      - name: Test SQLx migrations
        env:
          SESSION_SQLX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked -p centaur-session-sqlx

      - name: Cleanup Test Postgres
        if: ${{ always() }}
        run: docker rm -f centaur-api-plain-postgres || true

  sandbox-tests:
    name: Sandbox Python tests
    runs-on: depot-ubuntu-24.04-4
    needs: ci_changes
    if: needs.ci_changes.outputs.sandbox_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Tool-host integration tests execute real CLIs through uvx.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Sandbox Python tests
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s services/sandbox -p 'test_*.py'

  workflow-python-tests:
    name: Workflow Python tests
    runs-on: depot-ubuntu-24.04-4
    needs: ci_changes
    if: needs.ci_changes.outputs.workflow_python_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: services/workflow-python/pyproject.toml

      - name: Workflow host tests
        run: >-
          uv run --project services/workflow-python
          python -m unittest discover
          -s services/workflow-python/tests
          -p 'test_*.py'

      - name: Workflow definition tests
        run: >-
          uv run --project services/workflow-python --with pytest
          python -m pytest workflows/tests workflows/slack/tests

  tool-tests:
    name: Tool tests
    runs-on: depot-ubuntu-24.04-4
    needs: ci_changes
    if: needs.ci_changes.outputs.tool_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: tools/**/pyproject.toml

      - name: Start Test Postgres
        run: .github/scripts/start-test-postgres.sh tool-test-postgres 5432 postgres

      - name: Run tool tests
        env:
          COMPANY_CONTEXT_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: .github/scripts/run-tool-tests.sh

  slackbotv2-tests:
    name: Slackbot v2 tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.slackbotv2_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.7
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Slackbot v2 tests
        working-directory: services/slackbotv2
        run: bun test test

