name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci_changes:
    name: Detect CI changes
    runs-on: ubuntu-latest
    outputs:
      migration_order: ${{ steps.filter.outputs.migration_order }}
      harness_server_checks: ${{ steps.filter.outputs.harness_server_checks }}
      rust_api: ${{ steps.filter.outputs.rust_api }}
      sandbox_tests: ${{ steps.filter.outputs.sandbox_tests }}
      workflow_python_tests: ${{ steps.filter.outputs.workflow_python_tests }}
      tool_tests: ${{ steps.filter.outputs.tool_tests }}
      slackbotv2_tests: ${{ steps.filter.outputs.slackbotv2_tests }}
      discordbot_checks: ${{ steps.filter.outputs.discordbot_checks }}
      githubbot_checks: ${{ steps.filter.outputs.githubbot_checks }}
      teamsbot_checks: ${{ steps.filter.outputs.teamsbot_checks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        name: Detect changed paths
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            changed_files="$(git diff --name-only "${base}...HEAD")"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            changed_files="$(git diff --name-only "${{ github.event.before }}...HEAD")"
          else
            git fetch --no-tags --depth=1 origin main
            changed_files="$(git diff --name-only origin/main...HEAD)"
          fi

          matches() {
            local pattern
            for pattern in "$@"; do
              if printf '%s\n' "${changed_files}" | grep -Eq "${pattern}"; then
                return 0
              fi
            done
            return 1
          }

          set_output() {
            local name="$1"
            shift
            if matches "$@"; then
              echo "${name}=true" >>"${GITHUB_OUTPUT}"
            else
              echo "${name}=false" >>"${GITHUB_OUTPUT}"
            fi
          }

          set_output migration_order \
            '^services/api-rs/crates/centaur-session-sqlx/migrations/' \
            '^services/console/db/migrate/' \
            '^\.github/scripts/check-migration-order\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output harness_server_checks \
            '^crates/harness-server/' \
            '^\.github/workflows/ci\.yml$'
          set_output rust_api \
            '^services/api-rs/' \
            '^services/workflow-python/' \
            '^workflows/' \
            '^\.github/workflows/ci\.yml$'
          set_output sandbox_tests \
            '^services/sandbox/' \
            '^\.github/workflows/ci\.yml$'
          set_output workflow_python_tests \
            '^services/workflow-python/' \
            '^workflows/' \
            '^\.github/workflows/ci\.yml$'
          set_output tool_tests \
            '^tools/' \
            '^centaur_sdk/' \
            '^\.github/scripts/run-tool-tests\.sh$' \
            '^\.github/workflows/ci\.yml$'
          set_output slackbotv2_tests \
            '^services/slackbotv2/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'
          set_output discordbot_checks \
            '^services/discordbot/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'
          set_output githubbot_checks \
            '^services/githubbot/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'
          set_output teamsbot_checks \
            '^services/teamsbot/' \
            '^package\.json$' \
            '^pnpm-lock\.yaml$' \
            '^pnpm-workspace\.yaml$' \
            '^\.github/workflows/ci\.yml$'

  migration-order:
    name: Migration order
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.migration_order == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check migration versions
        run: .github/scripts/check-migration-order.sh "origin/${{ github.base_ref || 'main' }}"

  harness-server-checks:
    name: Harness server fmt, clippy, and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.harness_server_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/harness-server

      - name: Format
        working-directory: crates/harness-server
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: crates/harness-server
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: crates/harness-server
        run: cargo test --locked

  rust-api:
    name: Rust API fmt, clippy, and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.rust_api == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start Test Postgres
        run: .github/scripts/start-paradedb-postgres.sh centaur-api-test-postgres 5432 centaur

      - name: Install Console packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips libpq-dev

      - name: Set up Console Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          working-directory: services/console
          bundler-cache: true

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: services/api-rs

      - name: Format
        working-directory: services/api-rs
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: services/api-rs
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: services/api-rs
        env:
          SESSION_SQLX_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: cargo test --workspace

      - name: Run API integration test
        working-directory: services/api-rs
        env:
          API_INTEGRATION_WORKFLOW_DIR: ${{ runner.temp }}/api-integration-workflows
          BIND_ADDR: 127.0.0.1:18080
          CENTAUR_CONSOLE_DB_HOST: 127.0.0.1
          CENTAUR_CONSOLE_DB_PASSWORD: postgres
          CENTAUR_CONSOLE_DB_PORT: "5432"
          CENTAUR_CONSOLE_DB_USERNAME: postgres
          CENTAUR_CONSOLE_INITIAL_API_KEY: iak_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CENTAUR_CONSOLE_INITIAL_USER_EMAIL: api-integration@example.com
          CENTAUR_CONSOLE_INITIAL_USER_PASSWORD: api-integration-password
          CENTAUR_API_URL: http://127.0.0.1:18080
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/centaur?sslmode=disable
          IRON_CONTROL_API_KEY: iak_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          IRON_CONTROL_URL: http://127.0.0.1:18081
          RAILS_ENV: development
          RUN_MIGRATIONS: "true"
          RUST_LOG: info
          WORKFLOW_DIRS: ${{ runner.temp }}/api-integration-workflows
          WORKFLOW_HOST_SANDBOX: "false"
          WORKFLOW_REAP_REMOVED_AFTER_TICKS: "1"
          WORKFLOW_RECONCILE_INTERVAL_SECS: "1"
        run: |
          mkdir -p "$API_INTEGRATION_WORKFLOW_DIR"
          cargo build --locked -p centaur-api-server -p centaur-api-integration-test

          PGPASSWORD="$CENTAUR_CONSOLE_DB_PASSWORD" createdb \
            --host "$CENTAUR_CONSOLE_DB_HOST" \
            --port "$CENTAUR_CONSOLE_DB_PORT" \
            --username "$CENTAUR_CONSOLE_DB_USERNAME" \
            iron_control_development
          pushd ../console
          bin/rails db:schema:load
          bin/rails runner 'Iron::Bootstrap.run!'
          bin/rails server --binding 127.0.0.1 --port 18081 > "$RUNNER_TEMP/iron-control.log" 2>&1 &
          iron_control_pid="$!"
          echo "$iron_control_pid" > "$RUNNER_TEMP/iron-control.pid"
          popd

          for attempt in {1..120}; do
            if curl --fail --silent "$IRON_CONTROL_URL/up" > /dev/null; then
              break
            fi
            if ! kill -0 "$iron_control_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/iron-control.log"
              exit 1
            fi
            if [[ "$attempt" == "120" ]]; then
              cat "$RUNNER_TEMP/iron-control.log"
              exit 1
            fi
            sleep 0.25
          done

          ./target/debug/centaur-api-server > "$RUNNER_TEMP/centaur-api-server.log" 2>&1 &
          api_pid="$!"
          echo "$api_pid" > "$RUNNER_TEMP/centaur-api-server.pid"
          trap 'kill "$api_pid" "$iron_control_pid" 2>/dev/null || true' EXIT

          ./target/debug/centaur-api-integration-test

      - name: Dump API integration test logs
        if: ${{ failure() }}
        run: |
          cat "$RUNNER_TEMP/centaur-api-server.log" || true
          cat "$RUNNER_TEMP/iron-control.log" || true
          docker logs centaur-api-test-postgres || true

      - name: Cleanup API integration test dependencies
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/centaur-api-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/centaur-api-server.pid")" 2>/dev/null || true
          fi
          if [ -f "$RUNNER_TEMP/iron-control.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/iron-control.pid")" 2>/dev/null || true
          fi
          docker rm -f centaur-api-test-postgres || true

  sandbox-tests:
    name: Sandbox Python tests
    runs-on: ubuntu-latest
    needs: ci_changes
    if: needs.ci_changes.outputs.sandbox_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Sandbox Python tests
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s services/sandbox -p 'test_*.py'

  workflow-python-tests:
    name: Workflow Python tests
    runs-on: ubuntu-latest
    needs: ci_changes
    if: needs.ci_changes.outputs.workflow_python_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: services/workflow-python/pyproject.toml

      - name: Workflow host tests
        run: >-
          uv run --project services/workflow-python
          python -m unittest discover
          -s services/workflow-python/tests
          -p 'test_*.py'

      - name: Workflow definition tests
        run: >-
          uv run --project services/workflow-python --with pytest
          python -m pytest workflows/tests workflows/slack/tests

  tool-tests:
    name: Tool tests
    runs-on: ubuntu-latest
    needs: ci_changes
    if: needs.ci_changes.outputs.tool_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: tools/**/pyproject.toml

      - name: Run tool tests
        run: .github/scripts/run-tool-tests.sh

  slackbotv2-tests:
    name: Slackbot v2 tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.slackbotv2_tests == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Slackbot v2 tests
        working-directory: services/slackbotv2
        run: bun test test

  linearbot-tests:
    name: Linearbot typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: services/linearbot
        run: bun run check:types

      - name: Linearbot tests
        working-directory: services/linearbot
        run: bun test test

  discordbot-checks:
    name: Discordbot typecheck and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.discordbot_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Workspace-root install: discordbot links @centaur/* workspace packages
      # and relies on the root pnpm patches.
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Discordbot
        working-directory: services/discordbot
        run: bun run check:types

      - name: Discordbot tests
        working-directory: services/discordbot
        run: bun run test

  githubbot-checks:
    name: Githubbot typecheck and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.githubbot_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Workspace-root install: githubbot links @centaur/* workspace packages
      # and relies on the root pnpm patches.
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Githubbot
        working-directory: services/githubbot
        run: bun run check:types

      - name: Githubbot tests
        working-directory: services/githubbot
        run: bun run test

  teamsbot-checks:
    name: Teamsbot typecheck and tests
    runs-on: depot-ubuntu-24.04-16
    needs: ci_changes
    if: needs.ci_changes.outputs.teamsbot_checks == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.28.1
          run_install: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck Teamsbot
        working-directory: services/teamsbot
        run: bun run check:types

      - name: Teamsbot tests
        working-directory: services/teamsbot
        run: bun run test

  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    if: always()
    needs:
      - ci_changes
      - migration-order
      - harness-server-checks
      - rust-api
      - sandbox-tests
      - workflow-python-tests
      - tool-tests
      - slackbotv2-tests
      - discordbot-checks
      - githubbot-checks
      - teamsbot-checks
    timeout-minutes: 30
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          allowed-skips: migration-order, harness-server-checks, rust-api, sandbox-tests, workflow-python-tests, tool-tests, slackbotv2-tests, discordbot-checks, githubbot-checks, teamsbot-checks
          jobs: ${{ toJSON(needs) }}
