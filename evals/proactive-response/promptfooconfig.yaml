# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Slack proactive-response classifier for unmentioned replies in mentioned threads

# The provider builds the transcript from the case's `thread` var; the prompt
# only shows the thread in the results view.
prompts:
  - '{{thread | dump}}'

# Add entries to compare classifier models side by side.
providers:
  - id: file://provider.ts
    label: gpt-6-luna
    config:
      # Same default as slackbotv2.proactivity.model.
      model: gpt-6-luna
      # Production uses 2s; a longer timeout separates accuracy from latency,
      # which promptfoo reports per case.
      timeoutMs: 10000

# Every case reaches the classifier: the newest message is non-empty, does not
# mention the bot, and arrives in an eligible thread with no active execution.
# Positives score under should_respond (recall) and negatives under
# should_decline (1 - false-positive rate), so a prompt change that trades one
# for the other is visible.
defaultTest:
  assert:
    - type: javascript
      metric: '{{ "should_respond" if respond else "should_decline" }}'
      value: 'output.respond === context.vars.respond'

tests:
  - file://cases.yaml
  - file://threads.yaml
