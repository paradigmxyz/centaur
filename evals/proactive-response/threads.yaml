# Multi-party threads, oldest first as {author: text}; the last entry is the
# newest message. Each thread appears several times, cut at different points.
# Whole threads are held out (descriptions prefixed holdout/) so prompt tuning
# can be checked on threads it never saw. Tune with
# --filter-pattern '^(?!holdout/)', then report both. Do not move a thread
# between splits after tuning on it.

