# Each thread lists messages oldest first as {author: text}; the last entry is
# the newest, unmentioned message being classified. The author `centaur` is
# the bot. Earlier mentions appear as "@centaur", as Chat SDK renders them.
#
# The newest message never @-mentions another user: the bot skips those before
# classifying, so they would not measure the classifier.

# Follow-ups to the bot's answer
