[package]
name = "centaur-codemode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Code Mode runtime: runs agent-written JavaScript cells against TypeScript connectors in QuickJS"

[[bin]]
name = "centaur-codemode"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
clap.workspace = true
eyre.workspace = true
oxc = { version = "0.158", features = ["codegen", "isolated_declarations", "semantic", "transformer"] }
reqwest.workspace = true
rquickjs = { version = "0.14", features = ["futures", "loader", "parallel"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
