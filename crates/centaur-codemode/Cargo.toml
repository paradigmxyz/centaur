[package]
name = "centaur-codemode"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Code Mode runtime: runs agent-written JavaScript cells against TypeScript connectors in QuickJS"

[[bin]]
name = "centaur-codemode"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
centaur-codemode-protocol.workspace = true
clap.workspace = true
flate2 = "1"
futures-util.workspace = true
eyre.workspace = true
hex.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry_sdk.workspace = true
oxc = { version = "0.158", features = ["ast_visit", "codegen", "isolated_declarations", "semantic", "transformer"] }
reqwest = { workspace = true, features = ["gzip", "deflate"] }
rquickjs = { version = "0.14", features = ["futures", "loader", "parallel"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[dev-dependencies]
centaur-codemode-protocol = { workspace = true, features = ["testing"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
