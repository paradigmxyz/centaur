[package]
name = "centaur-console-db"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
active-record-encryption = { path = "../active-record-encryption" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqids = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["json", "postgres"] }

[dev-dependencies]
rand = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
