[package]
name = "centaur-token-broker"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
active-record-encryption = { path = "../active-record-encryption" }
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["form", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqids = "0.4"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
rand = "0.10"
