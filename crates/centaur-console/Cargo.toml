[package]
name = "centaur-console"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Centaur console (credential-control API and operator UI), RFC 0006."

[[bin]]
name = "centaur-console"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
axum.workspace = true
centaur-console-api.workspace = true
centaur-console-auth.workspace = true
centaur-console-db.workspace = true
centaur-telemetry.workspace = true
chrono.workspace = true
clap.workspace = true
rustls.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing.workspace = true
url.workspace = true
urlencoding.workspace = true

[dev-dependencies]
centaur-console-db = { workspace = true, features = ["testing"] }
serde_json.workspace = true

[lints]
workspace = true
